        root = Path(os.environ['GITHUB_WORKSPACE'])
        root.mkdir(exist_ok=True)
        bundle = json.loads(lzma.decompress(base64.b85decode(''.join(payload.split()).replace(':', '$'))))
        for name, script in bundle['scripts'].items():
            for i, literal in enumerate(bundle['literals']):
                script = script.replace('__TOUCH_LITERAL_' + str(i) + '__', repr(literal.encode('utf-8')))
            (root / name).parent.mkdir(parents=True,exist_ok=True)
            (root / name).write_text(script, encoding='utf-8')
