                    // permits every VSYNC (~8.3ms). No additional busy-loop timer.
                    long minimumIntervalNs = _touch11Mode == 1 ? 15_800_000L : 0L;
                    bool frameDue = _touch11LastDrivenFrameNs == 0 ||
                        frameTimeNanos - _touch11LastDrivenFrameNs >= minimumIntervalNs;
                    if (frameDue)
