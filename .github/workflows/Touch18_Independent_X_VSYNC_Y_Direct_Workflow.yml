               '<ApplicationTitle>OpenUtau Touch 9</ApplicationTitle>',
               '<ApplicationTitle>OpenUtau Touch 10</ApplicationTitle>',
               'Touch 10 app title')
        change(root/'Platforms/Android/AndroidManifest.xml',
               'android:label="OpenUtau Touch 9"',
               'android:label="OpenUtau Touch 10"',
               'Touch 10 launcher label')
        provider = root/'Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs'
        change(provider,
               'pers.vocoder712.openutaumobile.touchmarquee.v9.documents',
               'pers.vocoder712.openutaumobile.touchmarquee.v10.documents',
               'Touch 10 document provider authority')
        change(provider,
               'ColumnTitle, "OpenUtau Touch 9"',
               'ColumnTitle, "OpenUtau Touch 10"',
               'Touch 10 provider title')

        # A tiny compact switch and the original Touch 9 diagnostics occupy one stack.
        xaml = root/'Views/EditPage.xaml'
        change(xaml,
               # Match Touch 9's generated XAML exactly: it indents the Label by 12
               # spaces, rather than the 16 spaces assumed by the first Touch 10 build.
               '''            <!-- Touch 9: lightweight rolling diagnostics, not an actual display FPS counter -->
                    <Label x:Name="Touch9DiagLabel"
                           Text="Touch 9 diagnosing…"
                           TextColor="White"
                           BackgroundColor="#C0202020"
                           FontSize="11"
                           FontAttributes="Bold"
                           Padding="7,5"
                           InputTransparent="True"
                           AbsoluteLayout.LayoutBounds="1,1,AutoSize,AutoSize"
                           AbsoluteLayout.LayoutFlags="PositionProportional" />''',
               '''            <!-- Touch 10: independent VSYNC probe and opt-in frame-driven redraw experiment. -->
                    <VerticalStackLayout AbsoluteLayout.LayoutBounds="1,1,AutoSize,AutoSize"
                                         AbsoluteLayout.LayoutFlags="PositionProportional" Spacing="2">
                        <Button x:Name="Touch10DriveButton"
                                Text="帧驱动：关" HeightRequest="30" FontSize="12" Padding="8,0"
                                CornerRadius="7" TextColor="White" BackgroundColor="#C0303030"
                                HorizontalOptions="End" Clicked="Touch10DriveButton_Clicked" />
                        <Label x:Name="Touch9DiagLabel"
                               Text="Touch 10 diagnosing…" TextColor="White" BackgroundColor="#C0202020"
                               FontSize="11" FontAttributes="Bold" Padding="7,5" InputTransparent="True" />
                    </VerticalStackLayout>''',
               'Touchable frame-drive toggle while preserving Touch 9 metrics')

        edit = root/'Views/EditPage.xaml.cs'

        # Touch 3 created an inertia animation driven by a timer. In experimental mode,
        # let the frame callback advance its existing physics instead of a second timer.
        change(edit,
               '''        private readonly Action? _onScroll;
                private Transformer? _transformer;''',
               '''        private readonly Action? _onScroll;
                public bool ExternalFrameDrive { get; set; }
                public bool IsAnimating => _transformer != null;
                public void Pulse() { if (ExternalFrameDrive && _transformer != null) Tick(null, EventArgs.Empty); }
                private Transformer? _transformer;''',
               'Allow frame-paced inertia while retaining old physics')
        change(edit,
               '''            _timer.Start();
                }

                private void Tick(object? sender, EventArgs e)''',
               '''            if (!ExternalFrameDrive) _timer.Start();
                }

                private void Tick(object? sender, EventArgs e)''',
               'Avoid competing inertia timers in frame-drive mode')
        change(edit,
               '''        _pianoMomentum ??= new MomentumScroller(Dispatcher);
                _pianoMomentum.Begin(point);''',
               '''        _pianoMomentum ??= new MomentumScroller(Dispatcher);
                _pianoMomentum.ExternalFrameDrive = _touch10DriveEnabled;
                _pianoMomentum.Begin(point);''',
               'Propagate experimental mode to piano inertia')
        change(edit,
               '''        _trackMomentum ??= new MomentumScroller(Dispatcher, UpdateLeftScrollView);
                _trackMomentum.Begin(point);''',
               '''        _trackMomentum ??= new MomentumScroller(Dispatcher, UpdateLeftScrollView);
                _trackMomentum.ExternalFrameDrive = _touch10DriveEnabled;
                _trackMomentum.Begin(point);''',
               'Propagate experimental mode to track inertia')

        # An Android-specific callback, never requested when no gesture/animation is active.
        # Note: VSYNC callbacks are not actual presented frames. In drive mode, we also
        # request repaint for a brief gesture interval; the UI may still be capped.
        change(edit,
               '''    private IDispatcherTimer? _touch9ReportTimer;''',
               '''    private IDispatcherTimer? _touch9ReportTimer;
            private bool _touch10DriveEnabled = false; // default OFF; can be reverted instantly
        #if ANDROID
            private Android.Views.Choreographer? _touch10Choreographer;
            private Touch10VsyncCallback? _touch10Callback;
            private bool _touch10LoopRunning;
            private bool _touch10FingerDown;
            private bool _touch10Disposed;
            private long _touch10LastTouchStamp;
            private int _touch10VsyncCallbacks;
            private int _touch10DrivenRequests;

            private sealed class Touch10VsyncCallback : Java.Lang.Object, Android.Views.Choreographer.IFrameCallback
            {
                private readonly EditPage _page;
                public Touch10VsyncCallback(EditPage page) { _page = page; }
                public void DoFrame(long frameTimeNanos) { _page.Touch10OnFrame(frameTimeNanos); }
            }

            private void Touch10StartFrameLoop()
            {
                if (_touch10Disposed || _touch10LoopRunning) return;
                // Touch handler and the MAUI playback timer run on the main Looper.
                _touch10Choreographer ??= Android.Views.Choreographer.Instance;
                if (_touch10Choreographer == null) return;
                _touch10Callback ??= new Touch10VsyncCallback(this);
                _touch10LoopRunning = true;
                _touch10Choreographer.PostFrameCallback(_touch10Callback);
            }

            private void Touch10StopFrameLoop()
            {
                _touch10LoopRunning = false;
                if (_touch10Choreographer != null && _touch10Callback != null)
                    _touch10Choreographer.RemoveFrameCallback(_touch10Callback);
            }

            private void Touch10HandleTouch(SkiaSharp.Views.Maui.SKTouchAction action)
            {
                if (action == SkiaSharp.Views.Maui.SKTouchAction.Pressed ||
                    action == SkiaSharp.Views.Maui.SKTouchAction.Moved)
                {
                    _touch10FingerDown = true;
                    _touch10LastTouchStamp = System.Diagnostics.Stopwatch.GetTimestamp();
                    Touch10StartFrameLoop();
                }
                else if (action == SkiaSharp.Views.Maui.SKTouchAction.Released ||
                         action == SkiaSharp.Views.Maui.SKTouchAction.Cancelled)
                {
                    _touch10FingerDown = false;
                    _touch10LastTouchStamp = System.Diagnostics.Stopwatch.GetTimestamp();
                }
            }

            private void Touch10OnFrame(long frameTimeNanos)
            {
                if (!_touch10LoopRunning || _touch10Disposed) return;
                System.Threading.Interlocked.Increment(ref _touch10VsyncCallbacks);
                bool animating = (_pianoMomentum?.IsAnimating == true) || (_trackMomentum?.IsAnimating == true);
                // All callbacks happen on the UI thread. Never block waiting for a render.
                if (_touch10DriveEnabled)
                {
                    _pianoMomentum?.Pulse();
                    _trackMomentum?.Pulse();
                    // Experimental comparison: does Skia really execute a draw for each
                    // Android frame when explicitly invalidated during a finger gesture?
                    if (_touch10FingerDown)
                    {
                        System.Threading.Interlocked.Increment(ref _touch10DrivenRequests);
                        PianoRollCanvas.InvalidateSurface();
                        PianoRollTickBackgroundCanvas.InvalidateSurface();
                    }
                }
                long now = System.Diagnostics.Stopwatch.GetTimestamp();
                bool recentlyTouched = (now - _touch10LastTouchStamp) < System.Diagnostics.Stopwatch.Frequency * 3 / 2;
                if (!_touch10FingerDown && !_viewModel.Playing && !animating && !recentlyTouched)
                {
                    _touch10LoopRunning = false; // frame callbacks are one-shot
                    return;
                }
                _touch10Choreographer?.PostFrameCallback(_touch10Callback);
            }
        #endif''',
               'Android Choreographer probe and reversible frame-paced scroll')

        # Touch 9 attached metrics at this unique call site; add the probe there.
        change(edit,
               '''        if (e.ActionType == SkiaSharp.Views.Maui.SKTouchAction.Moved)
                    System.Threading.Interlocked.Increment(ref _touch9Moves);''',
               '''        if (e.ActionType == SkiaSharp.Views.Maui.SKTouchAction.Moved)
                    System.Threading.Interlocked.Increment(ref _touch9Moves);
        #if ANDROID
                Touch10HandleTouch(e.ActionType);
        #endif''',
               'Track Android VSYNC only during editor touch gestures')

        # Also probe during playback to diagnose whether a 120Hz frame pulse is available.
        change(edit,
               '''            System.Threading.Interlocked.Increment(ref _touch9PlaybackTicks);
                    PlaybackManager.Inst.UpdatePlayPos();''',
               '''            System.Threading.Interlocked.Increment(ref _touch9PlaybackTicks);
        #if ANDROID
                    if (_viewModel.Playing) Touch10StartFrameLoop();
        #endif
                    PlaybackManager.Inst.UpdatePlayPos();''',
               'Probe frame callbacks while playing')

        # Report both incoming Choreographer callbacks and how often experimental
        # redraws were requested, next to the existing paint counters.
        change(edit,
               '''Touch9DiagLabel.Text = $"Touch {touch}/s   Req {req}/s   Tick {tick}/s\\nPiano {piano}/s ({pianoMs:F1}ms)  Grid {grid}/s ({gridMs:F1}ms)";''',
               '''Touch9DiagLabel.Text = $"Touch {touch}/s   Req {req}/s   Tick {tick}/s\\nPiano {piano}/s ({pianoMs:F1}ms)  Grid {grid}/s ({gridMs:F1}ms)";
        #if ANDROID
                    int vsync = System.Threading.Interlocked.Exchange(ref _touch10VsyncCallbacks, 0);
                    int drive = System.Threading.Interlocked.Exchange(ref _touch10DrivenRequests, 0);
                    Touch9DiagLabel.Text += $"\\nVSYNC {vsync}/s   Drive {drive}/s   {(_touch10DriveEnabled ? "ON" : "OFF")}";
        #endif''',
               'Add VSYNC and frame-drive rates to performance report')

        # The opt-in switch is intentionally small. It stops any active inertia when
        # changing modes so the old and new scheduling methods cannot run together.
        change(edit,
               '''    public void Dispose()
            {''',
               '''    private void Touch10DriveButton_Clicked(object sender, EventArgs e)
            {
                _touch10DriveEnabled = !_touch10DriveEnabled;
                _pianoMomentum?.Stop();
                _trackMomentum?.Stop();
                if (_pianoMomentum != null) _pianoMomentum.ExternalFrameDrive = _touch10DriveEnabled;
                if (_trackMomentum != null) _trackMomentum.ExternalFrameDrive = _touch10DriveEnabled;
                Touch10DriveButton.Text = _touch10DriveEnabled ? "帧驱动：开" : "帧驱动：关";
        #if ANDROID
                _touch10LastTouchStamp = System.Diagnostics.Stopwatch.GetTimestamp();
                Touch10StartFrameLoop();
        #endif
            }

            protected override void OnDisappearing()
            {
        #if ANDROID
                _touch10FingerDown = false;
                Touch10StopFrameLoop();
        #endif
                base.OnDisappearing();
            }

            public void Dispose()
            {''',
               'Touch 10 mode switch and lifecycle cleanup')
        change(edit,
               '''        PlaybackTimer.Stop();''',
               '''#if ANDROID
                _touch10Disposed = true;
                Touch10StopFrameLoop();
                _touch10Callback?.Dispose();
                _touch10Callback = null;
        #endif
                PlaybackTimer.Stop();''',
               'Release native VSYNC callback when editor disposed')

        # Non-Android builds keep the original timer behavior. A live camera video of
        # the diagnosis, not the nominal FPS, decides whether changes are beneficial.
        cs = edit.read_text(encoding='utf-8-sig')
        x = xaml.read_text(encoding='utf-8-sig')
