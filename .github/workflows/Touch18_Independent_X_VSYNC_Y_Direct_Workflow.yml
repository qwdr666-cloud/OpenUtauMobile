            'Remember last horizontally driven viewport position')

        one(edit,
            '''                if (_touch11Dirty)
                        {
                            bool updateVerticalKeys = _touch13VerticalDirty;
                            _touch13VerticalDirty = false;
                            _touch11Dirty = false;
                            _touch11LastDrivenFrameNs = frameTimeNanos;
                            System.Threading.Interlocked.Increment(ref _touch10DrivenRequests);
                            // One cohesive refresh batch. Idle fingers no longer cause
                            // continual redraws of identical pictures.
                            PianoRollCanvas.InvalidateSurface();
                            PianoRollTickBackgroundCanvas.InvalidateSurface();
                            PianoRollPlayheadCanvas.InvalidateSurface();
                            PianoRollPitchCanvas.InvalidateSurface();
                            PhonemeCanvas.InvalidateSurface();
                            ExpressionCanvas.InvalidateSurface();
                            if (updateVerticalKeys)
                            {
                                PianoKeysCanvas.InvalidateSurface();
                                PianoRollKeysBackgroundCanvas.InvalidateSurface();
                            }
                        }''',
            '''                if (_touch11Dirty)
                        {
                            float currentX = _viewModel.PianoRollTransformer.PanX;
                            float currentZoomX = _viewModel.PianoRollTransformer.ZoomX;
                            bool horizontalChanged = !float.IsFinite(_touch18LastDrawnPanX) ||
                                Math.Abs(currentX - _touch18LastDrawnPanX) > 0.05f ||
                                Math.Abs(currentZoomX - _touch18LastDrawnZoomX) > 0.00001f;
                            _touch11Dirty = false;
                            if (horizontalChanged)
                            {
                                // PanY is updated and repainted directly by its
                                // subscription. It is never driven by this callback.
                                _touch18LastDrawnPanX = currentX;
                                _touch18LastDrawnZoomX = currentZoomX;
                                _touch13VerticalDirty = false;
                                _touch11LastDrivenFrameNs = frameTimeNanos;
                                System.Threading.Interlocked.Increment(ref _touch10DrivenRequests);
                                PianoRollCanvas.InvalidateSurface();
                                PianoRollTickBackgroundCanvas.InvalidateSurface();
                                PianoRollPlayheadCanvas.InvalidateSurface();
                                PianoRollPitchCanvas.InvalidateSurface();
                                PhonemeCanvas.InvalidateSurface();
                                ExpressionCanvas.InvalidateSurface();
                            }
                        }''',
            'VSYNC repaint strictly gated on actual horizontal state changes')

        s = edit.read_text(encoding='utf-8-sig')
        assert s.count('private void Touch10OnFrame(') == 1
        assert s.count('private void Pulse(') == 0  # Pulse is public
        assert s.count('public void Pulse()') == 1
        assert s.count('private void Tick(object? sender, EventArgs e)') == 1
        assert s.count('Touch18HorizontalFrameRepaint') == 0
        assert s.count('bool horizontalChanged = !float.IsFinite(_touch18LastDrawnPanX)') == 1
        assert s.count('dragX < 10f * (float)_viewModel.Density') == 1
        assert s.count('_touch18LastDrawnPanX = _viewModel.PianoRollTransformer.PanX;') == 1
        assert s.count('if (horizontalChanged)') == 1
        assert s.count('if (_touch11Dirty)') == 1
        assert '_pianoMomentum?.Pulse();' in s
        assert s.count('private void UpdatePianoViewportPan(') == 1
        assert s.count('_pianoMomentum.PreferDirectVertical = true;') == 1
        assert s.count('_touch18LastVerticalFrame = now;') == 1
        assert s.count('Math.Abs(_velocity.Y) > Math.Abs(_velocity.X) * 3f') == 0
        assert 'pers.vocoder712.openutaumobile.touchmarquee.v18.documents' in provider.read_text(encoding='utf-8-sig')
        print('PASS: frame path is horizontal-only, vertical inertia timer is separate, cached notes/audio untouched')
        PYTOUCH18
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
      # GitHub hosted Ubuntu runner already includes Android SDK.
      # Avoid setup-android@v3, which tried to interactively accept unused Google TV SDK licenses.
    - name: Use preinstalled Android SDK
      shell: bash
      run: |
        set -euo pipefail
        SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        test -d "$SDK_ROOT" || { echo "::error::Android SDK directory not found: $SDK_ROOT"; exit 1; }
        echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "Using Android SDK at $SDK_ROOT"
        ls "$SDK_ROOT/build-tools" || true
    - name: Install MAUI Android workload
      run: dotnet workload install maui-android
    - name: Build signed standalone ARM64 APK
      run: >-
        dotnet publish OpenUtauMobile/OpenUtauMobile.csproj
        -f net9.0-android -c Release
        -p:TargetFrameworks=net9.0-android
        -p:RuntimeIdentifier=android-arm64
        -p:RuntimeIdentifiers=android-arm64
        -p:AndroidCreatePackagePerAbi=false
        -p:AndroidPackageFormats=apk
        -p:AndroidKeyStore=false
        -p:RunAOTCompilation=true
        -p:AndroidEnableProfiledAot=true
        -p:EmbedAssembliesIntoApk=true
        -bl:touch-build.binlog
    - name: Verify package and signature
      shell: bash
      run: |
        set -euo pipefail
        APK=$(find OpenUtauMobile/bin/Release -name '*-Signed.apk' -print -quit)
        if [[ -z "$APK" ]]; then
          echo '::error::Signed APK not found in Release output'
          exit 1
        fi
        BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
        "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt
        "$BUILD_TOOLS/aapt" dump badging "$APK" | tee package.txt
        "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > manifest-tree.txt

        # Verify Touch 18 independently of Touch 16 and the official package. The previous Touch 1 authority check
        # was mistakenly left in the old workflow and caused exit code 1.
        grep -Fq "package: name='pers.vocoder712.openutaumobile.touchmarquee.v18'" package.txt || {
          echo '::error::Touch 18 package name mismatch'; exit 1;
        }
        grep -Fq "application-label:'OpenUtau Touch 18'" package.txt || {
          echo '::error::Touch 18 application label mismatch'; exit 1;
        }
        grep -Eq "native-code:.*'arm64-v8a'" package.txt || {
          echo '::error::Expected ARM64 native libraries not found'; exit 1;
        }
        grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v18.documents' manifest-tree.txt || {
          echo '::error::Touch 18 DocumentsProvider authority not found'; exit 1;
        }
        if grep -Fq 'pers.vocoder712.openutaumobile.documents' manifest-tree.txt || \
           grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.documents' manifest-tree.txt || \
           grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v2.documents' manifest-tree.txt || \
           grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v3.documents' manifest-tree.txt || \
           grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v4.documents' manifest-tree.txt || \
           grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v5.documents' manifest-tree.txt || \
           grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v6.documents' manifest-tree.txt || \
           grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v7.documents' manifest-tree.txt || \
           grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v8.documents' manifest-tree.txt || \
            grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v9.documents' manifest-tree.txt || \
            grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v10.documents' manifest-tree.txt || \
            grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v11.documents' manifest-tree.txt || \
            grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v12.documents' manifest-tree.txt || \
            grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v13.documents' manifest-tree.txt || \
            grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v14.documents' manifest-tree.txt || \
            grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v15.documents' manifest-tree.txt || \
            grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v16.documents' manifest-tree.txt || \
                      grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v17.documents' manifest-tree.txt; then
          echo '::error::An original or older Touch DocumentsProvider authority remains'
          exit 1
        fi
        echo 'Checking packaged AOT outputs (informational):'
        unzip -Z1 "$APK" | grep -E 'libaot|aot-data' | head -n 12 || true
        echo 'All APK identity and coexistence checks passed.' 
        mkdir -p artifacts
        cp "$APK" artifacts/OpenUtau-Touch-18-Independent-Axes-ARM64.apk
        cp signature.txt package.txt manifest-tree.txt artifacts/
        sha256sum artifacts/*.apk > artifacts/SHA256SUMS
    - uses: actions/upload-artifact@v4
      with:
        name: OpenUtau-Touch-18-Independent-Axes-ARM64
        path: artifacts/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: touch-build-diagnostics
        path: touch-build.binlog
