        from pathlib import Path
        import re

        path = Path('OpenUtauMobile/Views/EditPage.xaml.cs')
        text = path.read_text(encoding='utf-8-sig')

        def once(old, new, label):
            global text
            n=text.count(old)
            if n!=1:
                raise RuntimeError(f'{label}: expected 1 match, got {n}')
            text=text.replace(old,new,1)
            print('OK:',label)

        once(
        '''    private void StartPianoViewportPan(SKPoint point)
            {''',
        '''    // Only viewport panning is direction locked. Note editing, curve drawing,
            // marquee selection and two-finger zoom keep their original gestures.
            private SKPoint _touch13PanOrigin;
            // 0=undecided, 1=horizontal, 2=vertical, 3=intentional diagonal.
            private int _touch13PanDirection;

            private void StartPianoViewportPan(SKPoint point)
            {
                _touch13PanOrigin = point;
                _touch13PanDirection = 0;''',
            'Initialize direction lock only for viewport panning')

        once('''    private void StartTrackViewportPan(SKPoint point)
            {''',
        '''    private void UpdatePianoViewportPan(SKPoint point)
            {
                var delta = point - _touch13PanOrigin;
                float absX = Math.Abs(delta.X);
                float absY = Math.Abs(delta.Y);

                // Wait for a purposeful displacement, then freeze that gesture's axis.
                // This avoids treating a few noisy touch samples as a direction change.
                float threshold = 18f * (float)_viewModel.Density;
                if (_touch13PanDirection == 0 &&
                    delta.LengthSquared >= threshold * threshold)
                {
                    const float dominance = 1.7f;
                    _touch13PanDirection = absX > absY * dominance ? 1 :
                        absY > absX * dominance ? 2 : 3;
                }

                SKPoint filtered = _touch13PanDirection switch
                {
                    1 => new SKPoint(point.X, _touch13PanOrigin.Y),
                    2 => new SKPoint(_touch13PanOrigin.X, point.Y),
