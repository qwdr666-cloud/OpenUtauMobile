    - name: Touch 8 - aim for 120Hz cursor, responsive piano scroll and inertia
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PYTOUCH8'
        from pathlib import Path
        root = Path('OpenUtauMobile')

        def replace_once(path, before, after, purpose):
            original = path.read_text(encoding='utf-8-sig')
            count = original.count(before)
            if count != 1:
                raise RuntimeError(f'{purpose}: expected one exact source match, found {count}. Target: {path}')
            path.write_text(original.replace(before, after, 1), encoding='utf-8')
            print('OK:', purpose)

        # Each Touch release uses an independent Android identity, including DocumentsProvider.
        replace_once(root/'OpenUtauMobile.csproj',
            '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v7</ApplicationId>',
            '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v8</ApplicationId>',
            'Touch 8 independent Android app ID')
        replace_once(root/'OpenUtauMobile.csproj',
            '<ApplicationTitle>OpenUtau Touch 7</ApplicationTitle>',
            '<ApplicationTitle>OpenUtau Touch 8</ApplicationTitle>',
            'Touch 8 app title')
        replace_once(root/'Platforms/Android/AndroidManifest.xml',
            'android:label="OpenUtau Touch 7"',
            'android:label="OpenUtau Touch 8"',
            'Touch 8 Android launcher label')
        replace_once(root/'Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs',
            'pers.vocoder712.openutaumobile.touchmarquee.v7.documents',
            'pers.vocoder712.openutaumobile.touchmarquee.v8.documents',
            'Touch 8 unique file provider')
        replace_once(root/'Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs',
            'ColumnTitle, "OpenUtau Touch 7"',
            'ColumnTitle, "OpenUtau Touch 8"',
            'Touch 8 file provider title')

        # The original playback time-position timer is only 20Hz; aim at 120Hz.
        # This changes visual play-position polling, not audio sample rate or synthesis.
        replace_once(Path('OpenUtau.Core/Util/Preferences.cs'),
            'public int PlaybackRefreshRate = 20;',
            'public int PlaybackRefreshRate = 120;',
            '120Hz target for playback cursor updates')

        edit = root/'Views/EditPage.xaml.cs'
        # Rx Throttle is a DEBOUNCE, NOT a frame limiter: continued gestures can
        # postpone emissions indefinitely. Sample periodically emits the latest state.
        replace_once(edit,
            '.Throttle(TimeSpan.FromMilliseconds(16.6)) // 限制更新频率为60FPS',
            '.Sample(TimeSpan.FromSeconds(1.0 / 120.0)) // Touch 8: sample latest drag position at up to 120Hz; do not debounce',
            'replace delayed horizontal redraws with 120Hz sampling')

        # Touch 3's inertia animation was created with a 16ms UI timer. Update it to
        # the same nominal 120Hz cadence; the actual Android frame rate may be lower.
        replace_once(edit,
            '_timer.Interval = TimeSpan.FromMilliseconds(16);',
            '_timer.Interval = TimeSpan.FromSeconds(1.0 / 120.0);',
            '120Hz target for inertial viewport animation')

        # Fail before paying for a full Android build if any expected change is missing.
        preferences=Path('OpenUtau.Core/Util/Preferences.cs').read_text(encoding='utf-8-sig')
        code=edit.read_text(encoding='utf-8-sig')
        assert 'public int PlaybackRefreshRate = 120;' in preferences
        assert '.Sample(TimeSpan.FromSeconds(1.0 / 120.0))' in code
        assert '.Throttle(TimeSpan.FromMilliseconds(16.6))' not in code
        assert '_timer.Interval = TimeSpan.FromSeconds(1.0 / 120.0);' in code
        assert 'pers.vocoder712.openutaumobile.touchmarquee.v8.documents' in (root/'Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs').read_text(encoding='utf-8-sig')
        print('Touch 8 performance patch applied. Nominal playback / scroll target: 120Hz; physical FPS must be measured on a device.')
        PYTOUCH8
