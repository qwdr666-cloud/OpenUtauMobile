            /// <summary>
            /// Page-local, bounded cache of pre-rasterized note bodies and lyric glyphs.
            /// It never caches the playhead, pitch/envelope editor, or selected-note UI.
            /// Each image is 512 physical pixels wide, so the cache follows long songs
            /// without allocating an image proportional to the whole song duration.
            /// </summary>
            public sealed class Touch16NoteTileCache : IDisposable
            {
                private const int TileWidth = 512;
                private const int MaxTiles = 8;
                private readonly Dictionary<int, SKImage> _images = new();
                private readonly LinkedList<int> _order = new();
                private UVoicePart? _part;
                private int _height, _count;
                private float _zoomX, _zoomY, _panY, _position, _keyHeight, _density;
                private SKColor _color, _lyricColor;
                private bool _configured;

                public void Invalidate()
                {
                    foreach (SKImage image in _images.Values) image.Dispose();
                    _images.Clear();
                    _order.Clear();
                    _configured = false;
                    _part = null;
                }

                public void Dispose() => Invalidate();

                public bool Draw(DrawableNotes owner)
                {
                    var canvas = owner.Canvas;
                    var vm = owner.ViewModel;
                    int width = canvas.DeviceClipBounds.Width;
                    int height = canvas.DeviceClipBounds.Height;
                    if (width <= 0 || height <= 0 || height > 3000 || width > TileWidth * MaxTiles - TileWidth)
                        return false;
                    float zx = vm.PianoRollTransformer.ZoomX;
                    float zy = vm.PianoRollTransformer.ZoomY;
                    float py = vm.PianoRollTransformer.PanY;
                    float px = vm.PianoRollTransformer.PanX;
                    float density = (float)vm.Density;
                    SKColor lyric = ThemeColorsManager.Current.LyricsText;
                    if (zx <= 0 || zy <= 0) return false;
                    if (!_configured || !ReferenceEquals(_part, owner.Part) ||
                        _height != height || _count != owner.Part.notes.Count ||
                        _zoomX != zx || _zoomY != zy || _panY != py ||
                        _position != owner.PositionX || _keyHeight != owner.HeightPerPianoKey ||
                        _density != density || _color != owner.NotesColor || _lyricColor != lyric)
                    {
                        Invalidate();
                        _configured = true;
                        _part = owner.Part;
                        _height = height;
                        _count = owner.Part.notes.Count;
                        _zoomX = zx;
                        _zoomY = zy;
                        _panY = py;
                        _position = owner.PositionX;
                        _keyHeight = owner.HeightPerPianoKey;
                        _density = density;
                        _color = owner.NotesColor;
                        _lyricColor = lyric;
                    }
                    int first = (int)Math.Floor(-px / TileWidth);
                    int last = (int)Math.Floor((width - px - 0.001) / TileWidth);
                    if (last - first + 1 > MaxTiles) return false;
                    for (int index = first; index <= last; index++)
                    {
                        if (!_images.TryGetValue(index, out SKImage? image))
                        {
                            image = RenderTile(owner, index);
                            if (image == null) return false;
                            _images.Add(index, image);
                            _order.AddLast(index);
                            if (_images.Count > MaxTiles)
                            {
                                int oldest = _order.First!.Value;
                                _order.RemoveFirst();
                                _images[oldest].Dispose();
                                _images.Remove(oldest);
                            }
                        }
                        else
                        {
                            _order.Remove(index);
                            _order.AddLast(index);
                        }
                        canvas.DrawImage(image, index * (float)TileWidth + px, 0);
                    }
                    return true;
                }

                private SKImage? RenderTile(DrawableNotes owner, int tile)
                {
                    var vm = owner.ViewModel;
                    var info = new SKImageInfo(TileWidth, _height, SKColorType.Rgba8888, SKAlphaType.Premul);
                    using SKSurface? surface = SKSurface.Create(info);
                    if (surface == null) return null;
                    SKCanvas canvas = surface.Canvas;
                    canvas.Clear(SKColors.Transparent);
                    float tileStart = tile * (float)TileWidth;
                    float tileEnd = tileStart + TileWidth;
                    float unitHeight = owner.HeightPerPianoKey * _zoomY;
                    using SKPaint notePaint = new();
                    using SKPaint lyricPaint = new() { Color = _lyricColor, IsAntialias = true };
                    using SKFont lyricFont = new(ObjectProvider.NotoSansCJKscRegularTypeface, 15f * _density);
                    // First pass: note rectangles. Keep the original layering order.
                    foreach (UNote note in owner.Part.notes)
                    {
                        float x = (owner.PositionX + note.position) * _zoomX;
                        float w = note.duration * _zoomX;
                        if (x + w < tileStart) continue;
                        if (x > tileEnd) break; // SortedSet<UNote>, ordered by time.
                        float y = (ViewConstants.TotalPianoKeys - note.tone - 1) * unitHeight + _panY;
                        if (y + unitHeight < 0 || y > _height) continue;
