            }''',
               '''    private void Touch10OnFrame(long frameTimeNanos)
            {
                if (!_touch10LoopRunning || _touch10Disposed) return;
                System.Threading.Interlocked.Increment(ref _touch10VsyncCallbacks);

                // Detect unusually long pauses *between Android frame callbacks*.
                // This measures pacing jitter, not the number of frames presented.
                if (_touch11LastVsyncNs > 0 && frameTimeNanos > _touch11LastVsyncNs &&
                    frameTimeNanos - _touch11LastVsyncNs > 25_000_000L)
                    System.Threading.Interlocked.Increment(ref _touch11MissedVsyncGaps);
                _touch11LastVsyncNs = frameTimeNanos;

                bool pianoAnimating = _pianoMomentum?.IsAnimating == true;
                bool trackAnimating = _trackMomentum?.IsAnimating == true;
                bool animating = pianoAnimating || trackAnimating;
                if (_touch10DriveEnabled)
