                            _pianoMomentum?.Pulse();
                            _touch11Dirty = true;
                        }
                        if (trackAnimating)
                            _trackMomentum?.Pulse();
                        if (_touch11Dirty)
                        {
                            _touch11Dirty = false;
                            _touch11LastDrivenFrameNs = frameTimeNanos;
                            System.Threading.Interlocked.Increment(ref _touch10DrivenRequests);
                            // One cohesive refresh batch. Idle fingers no longer cause
                            // continual redraws of identical pictures.
                            PianoRollCanvas.InvalidateSurface();
                            PianoRollTickBackgroundCanvas.InvalidateSurface();
                            PianoRollPlayheadCanvas.InvalidateSurface();
                            PianoRollPitchCanvas.InvalidateSurface();
                            PhonemeCanvas.InvalidateSurface();
                            ExpressionCanvas.InvalidateSurface();
                        }
                    }
                }
                long now = System.Diagnostics.Stopwatch.GetTimestamp();
                bool recentlyTouched = (now - _touch10LastTouchStamp) < System.Diagnostics.Stopwatch.Frequency * 3 / 2;
                if (!_touch10FingerDown && !_viewModel.Playing && !animating && !recentlyTouched)
                {
                    _touch10LoopRunning = false;
                    _touch11LastVsyncNs = 0;
                    return;
                }
                _touch10Choreographer?.PostFrameCallback(_touch10Callback);
            }''',
               'Coalesce paint requests and pace 60/120Hz inertia from VSYNC')

