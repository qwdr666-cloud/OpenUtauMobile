                'font.Size = Math.Max(8f, Math.Min(keyRowHeight * 0.34f, width * 0.39f));',
                'font.Size = Math.Max(10f, Math.Min(keyRowHeight * 0.48f, width * 0.58f));',
                'make pitch names considerably larger')
