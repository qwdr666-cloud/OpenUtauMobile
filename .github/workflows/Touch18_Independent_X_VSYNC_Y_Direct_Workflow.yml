        cache_class = r'''    /// <summary>
            /// Touch 17: bounded 2D raster tiles in song-space pixel coordinates.
            /// PanX and PanY only translate cached tiles: neither invalidates them.
            /// Each tile is 512 x 256 RGBA pixels (~0.5 MiB); 300 tiles ~150 MiB.
            /// Actual usage is capped at 160 MiB and 300 entries, whichever is lower.
            /// Audio, phonemization, pitch curves and the movable playhead are not cached.
            /// </summary>
            public sealed class Touch16NoteTileCache : IDisposable
            {
                private const int TileWidth = 512;
                private const int TileHeight = 256;
                private const int MaxTiles = 300;
                private const long MemoryBudgetBytes = 160L * 1024 * 1024;
                private const long TileBytes = (long)TileWidth * TileHeight * 4L;
                private readonly Dictionary<(int X, int Y), Entry> _images = new();
                private readonly LinkedList<(int X, int Y)> _recent = new();
                private sealed class Entry
                {
                    public SKImage Image;
                    public LinkedListNode<(int X, int Y)> Node;
                    public Entry(SKImage image, LinkedListNode<(int X, int Y)> node)
                    { Image = image; Node = node; }
                }

                private UVoicePart? _part;
                private int _count;
                private float _zoomX, _zoomY, _position, _keyHeight, _density;
                private SKColor _color, _lyricColor;
                private bool _configured;
                private long _bytes;
                private long _hits, _misses, _evictions;

                public string Status => $"Tiles {_images.Count}/{MaxTiles}  {_bytes / 1048576f:F1}MiB  Hit {_hits} Miss {_misses} Evict {_evictions}";

                public void Invalidate()
                {
                    foreach (Entry entry in _images.Values) entry.Image.Dispose();
                    _images.Clear();
                    _recent.Clear();
                    _bytes = 0;
                    _configured = false;
                    _part = null;
                    // Preserve counters across edits, reset on the next editor instance.
                }

                public void Dispose() => Invalidate();

                private void EvictLeastRecentlyUsed()
                {
                    LinkedListNode<(int X, int Y)>? node = _recent.First;
                    if (node == null) return;
                    _recent.RemoveFirst();
                    if (_images.TryGetValue(node.Value, out Entry? entry))
                    {
                        entry.Image.Dispose();
                        _images.Remove(node.Value);
                        _bytes -= TileBytes;
                        _evictions++;
                    }
                }

                private SKImage? GetOrCreate(DrawableNotes owner, int tx, int ty)
                {
                    (int X, int Y) key = (tx, ty);
                    if (_images.TryGetValue(key, out Entry? entry))
                    {
                        _recent.Remove(entry.Node);
                        _recent.AddLast(entry.Node);
                        _hits++;
                        return entry.Image;
                    }
                    _misses++;
                    SKImage? image = RenderTile(owner, tx, ty);
                    if (image == null) return null;
                    while (_images.Count >= MaxTiles || _bytes + TileBytes > MemoryBudgetBytes)
                        EvictLeastRecentlyUsed();
                    LinkedListNode<(int X, int Y)> node = _recent.AddLast(key);
                    _images.Add(key, new Entry(image, node));
                    _bytes += TileBytes;
                    return image;
                }

                public bool Draw(DrawableNotes owner)
                {
                    SKCanvas canvas = owner.Canvas;
                    var vm = owner.ViewModel;
                    int w = canvas.DeviceClipBounds.Width;
                    int h = canvas.DeviceClipBounds.Height;
                    if (w <= 0 || h <= 0 || w > 4096 || h > 4096) return false;
                    float zx = vm.PianoRollTransformer.ZoomX;
                    float zy = vm.PianoRollTransformer.ZoomY;
                    float px = vm.PianoRollTransformer.PanX;
                    float py = vm.PianoRollTransformer.PanY;
                    float density = (float)vm.Density;
                    SKColor lyric = ThemeColorsManager.Current.LyricsText;
                    if (zx <= 0 || zy <= 0 || !float.IsFinite(px) || !float.IsFinite(py)) return false;
                    if (!_configured || !ReferenceEquals(_part, owner.Part) ||
                        _count != owner.Part.notes.Count || _zoomX != zx || _zoomY != zy ||
                        _position != owner.PositionX || _keyHeight != owner.HeightPerPianoKey ||
                        _density != density || _color != owner.NotesColor || _lyricColor != lyric)
                    {
                        Invalidate();
                        _configured = true;
                        _part = owner.Part;
                        _count = owner.Part.notes.Count;
                        _zoomX = zx;
                        _zoomY = zy;
                        _position = owner.PositionX;
                        _keyHeight = owner.HeightPerPianoKey;
                        _density = density;
                        _color = owner.NotesColor;
                        _lyricColor = lyric;
                    }

                    // Song-space coordinates are stable when the viewport pans.
                    // Floor converts negative panning correctly, including diagonal swipes.
                    double left = -px / TileWidth;
                    double right = (w - px - 0.001) / TileWidth;
                    double top = -py / TileHeight;
                    double bottom = (h - py - 0.001) / TileHeight;
                    if (Math.Abs(left) > 10000000 || Math.Abs(right) > 10000000 ||
                        Math.Abs(top) > 10000000 || Math.Abs(bottom) > 10000000) return false;
                    int x0 = (int)Math.Floor(left), x1 = (int)Math.Floor(right);
                    int y0 = (int)Math.Floor(top), y1 = (int)Math.Floor(bottom);
                    long visibleCount = ((long)x1 - x0 + 1) * ((long)y1 - y0 + 1);
                    if (visibleCount <= 0 || visibleCount > MaxTiles || visibleCount * TileBytes > MemoryBudgetBytes)
                        return false;

                    for (int ty = y0; ty <= y1; ty++)
                    {
                        for (int tx = x0; tx <= x1; tx++)
                        {
                            SKImage? img = GetOrCreate(owner, tx, ty);
                            if (img == null) return false; // Retain Touch16 live rendering fallback.
                            canvas.DrawImage(img, tx * (float)TileWidth + px,
                                ty * (float)TileHeight + py);
                        }
                    }
                    return true;
                }

                private SKImage? RenderTile(DrawableNotes owner, int tx, int ty)
                {
                    float worldX = tx * (float)TileWidth;
                    float worldY = ty * (float)TileHeight;
                    float worldRight = worldX + TileWidth;
                    float worldBottom = worldY + TileHeight;
                    float unitHeight = owner.HeightPerPianoKey * _zoomY;
                    if (unitHeight <= 0) return null;
                    SKImageInfo info = new(TileWidth, TileHeight, SKColorType.Rgba8888, SKAlphaType.Premul);
                    using SKSurface? surface = SKSurface.Create(info);
                    if (surface == null) return null;
                    SKCanvas canvas = surface.Canvas;
                    canvas.Clear(SKColors.Transparent);
                    using SKPaint notePaint = new();
                    using SKPaint lyricPaint = new() { Color = _lyricColor, IsAntialias = true };
                    using SKFont lyricFont = new(ObjectProvider.NotoSansCJKscRegularTypeface, 15f * _density);

                    // Notes in song coordinates. Selection overlays remain outside cache.
                    foreach (UNote note in owner.Part.notes)
                    {
                        float x = (owner.PositionX + note.position) * _zoomX;
                        float width = note.duration * _zoomX;
                        if (x + width <= worldX) continue;
                        if (x >= worldRight) break;
                        float y = (ViewConstants.TotalPianoKeys - note.tone - 1) * unitHeight;
                        if (y + unitHeight <= worldY || y >= worldBottom) continue;
                        notePaint.Color = note.Error ? owner.NotesColor.WithAlpha(100) : owner.NotesColor;
                        canvas.DrawRect(x - worldX, y - worldY, width, unitHeight, notePaint);
                    }
                    // Draw glyph portions inside each tile, including those starting in
                    // the preceding X tile; clipping is handled by the tile surface.
                    float lyricMargin = 30f * _density;
                    foreach (UNote note in owner.Part.notes)
                    {
                        float x = (owner.PositionX + note.position) * _zoomX;
                        if (x > worldRight) break;
                        if (x < worldX - TileWidth) continue;
                        if (string.IsNullOrEmpty(note.lyric)) continue;
                        float y = (ViewConstants.TotalPianoKeys - note.tone - 1.5f) * unitHeight;
                        if (y < worldY - lyricMargin || y > worldBottom + lyricMargin) continue;
                        canvas.DrawText(note.lyric, x - worldX, y - worldY, lyricFont, lyricPaint);
                    }
                    return surface.Snapshot();
                }
            }
        '''
        notes.write_text(code[:start] + cache_class + code[namespace_close:], encoding='utf-8')
        print('OK: 512x256 viewport-independent LRU raster cache with 300 entries / 160MiB cap')

        # Add a low-frequency cache-status readout to the existing diagnostics.
