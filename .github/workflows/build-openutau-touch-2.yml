name: OpenUtau Touch 2 ARM64 - hold and edge-select
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: qwdr666-cloud/OpenUtauMobile
          ref: 17a86f602e054c345841684224903004eff1f536
          persist-credentials: false
      - name: Apply Touch source changes
        run: |
          python - <<'PYTHON'
          import base64, zlib
          from pathlib import Path
          Path('/tmp/touch.patch').write_bytes(zlib.decompress(base64.b64decode('')))
          PYTHON
          git apply --check /tmp/touch.patch
          git apply /tmp/touch.patch
      # Android requires unique ContentProvider authorities across all installed apps.
      # Original 1.1.7 hard-codes a DocumentsProvider authority independent of ApplicationId.
      - name: Isolate OpenUtau Touch documents provider
        shell: bash
        run: |
          python - <<'PYPROVIDER'
          from pathlib import Path
          path = Path('OpenUtauMobile/Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs')
          text = path.read_text(encoding='utf-8-sig')
          old = '["pers.vocoder712.openutaumobile.documents"]'
          new = '["pers.vocoder712.openutaumobile.touchmarquee.documents"]'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one original DocumentsProvider authority')
          text = text.replace(old, new)
          text = text.replace('ColumnTitle, "OpenUtau Mobile"', 'ColumnTitle, "OpenUtau Touch"')
          path.write_text(text, encoding='utf-8')
          print('Isolated DocumentsProvider authority:', new)
          PYPROVIDER
      - name: Upgrade to Touch 2 gestures and independent app identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYUPGRADE'
          import base64, zlib
          from pathlib import Path
          Path('/tmp/touch2.patch').write_bytes(zlib.decompress(base64.b64decode('')))
          PYUPGRADE
          git apply --check /tmp/touch2.patch
          git apply /tmp/touch2.patch
          python - <<'PYFINAL'
          from pathlib import Path

          # GitHub-hosted builds use temporary signing keys. Use a new package ID so
          # Touch 2 installs beside the existing Touch 1 and official OpenUtau Mobile.
          csproj = Path('OpenUtauMobile/OpenUtauMobile.csproj')
          c = csproj.read_text(encoding='utf-8-sig')
          old = '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee</ApplicationId>'
          assert c.count(old) == 1, 'Touch 1 package ID not found'
          c = c.replace(old, '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v2</ApplicationId>')
          assert c.count('<ApplicationTitle>OpenUtau Touch</ApplicationTitle>') == 1
          c = c.replace('<ApplicationTitle>OpenUtau Touch</ApplicationTitle>', '<ApplicationTitle>OpenUtau Touch 2</ApplicationTitle>')
          assert c.count('<ApplicationDisplayVersion>1.1.7</ApplicationDisplayVersion>') == 1
          c = c.replace('<ApplicationDisplayVersion>1.1.7</ApplicationDisplayVersion>', '<ApplicationDisplayVersion>1.1.8</ApplicationDisplayVersion>')
          assert c.count('<ApplicationVersion>16</ApplicationVersion>') == 1
          c = c.replace('<ApplicationVersion>16</ApplicationVersion>', '<ApplicationVersion>17</ApplicationVersion>')
          csproj.write_text(c, encoding='utf-8')

          manifest = Path('OpenUtauMobile/Platforms/Android/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8-sig')
          assert m.count('android:label="OpenUtau Touch"') == 1
          manifest.write_text(m.replace('android:label="OpenUtau Touch"', 'android:label="OpenUtau Touch 2"'), encoding='utf-8')

          provider = Path('OpenUtauMobile/Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs')
          p = provider.read_text(encoding='utf-8-sig')
          old_authority = 'pers.vocoder712.openutaumobile.touchmarquee.documents'
          assert p.count(old_authority) == 1, 'Touch 1 provider authority not found'
          p = p.replace(old_authority, 'pers.vocoder712.openutaumobile.touchmarquee.v2.documents')
          p = p.replace('ColumnTitle, "OpenUtau Touch"', 'ColumnTitle, "OpenUtau Touch 2"')
          provider.write_text(p, encoding='utf-8')

          # Brighten selected notes *after* painting the notes themselves.
          # The original border was drawn before the opaque note body, hiding it.
          draw = Path('OpenUtauMobile/Views/DrawableObjects/DrawableNotes.cs')
          d = draw.read_text(encoding='utf-8-sig')
          match = '            foreach (UNote note in Part.notes)'
          assert d.count(match) >= 2, 'Note rendering loop not found'
          glows = '            using SKPaint selectedLightFill = new()\n            {\n                Color = new SKColor(249, 254, 255, 112),\n                Style = SKPaintStyle.Fill,\n                IsAntialias = true,\n            };\n            using SKPaint selectedOuterGlow = new()\n            {\n                Color = new SKColor(91, 222, 255, 143),\n                Style = SKPaintStyle.Stroke,\n                StrokeWidth = 8f * (float)ViewModel.Density,\n                IsAntialias = true,\n            };\n            using SKPaint selectedBrightOutline = new()\n            {\n                Color = new SKColor(249, 253, 255, 255),\n                Style = SKPaintStyle.Stroke,\n                StrokeWidth = 2.5f * (float)ViewModel.Density,\n                IsAntialias = true,\n            };\n'
          d = d.replace(match, glows + match, 1)
          fill_marker = 'HeightPerPianoKey * ViewModel.PianoRollTransformer.ZoomY, paint);'
          assert d.count(fill_marker) == 1, 'Note body drawing call not found'
          enhanced = '\n                // Draw selected-note light last so the opaque body cannot cover it.\n                if (ViewModel.SelectedNotes.Contains(note))\n                {\n                    float x = (PositionX + note.position) * ViewModel.PianoRollTransformer.ZoomX + ViewModel.PianoRollTransformer.PanX;\n                    float y = (ViewConstants.TotalPianoKeys - note.tone - 1) * HeightPerPianoKey * ViewModel.PianoRollTransformer.ZoomY + ViewModel.PianoRollTransformer.PanY;\n                    float w = note.duration * ViewModel.PianoRollTransformer.ZoomX;\n                    float h = HeightPerPianoKey * ViewModel.PianoRollTransformer.ZoomY;\n                    Canvas.DrawRect(x, y, w, h, selectedLightFill);\n                    Canvas.DrawRect(x, y, w, h, selectedOuterGlow);\n                    Canvas.DrawRect(x, y, w, h, selectedBrightOutline);\n                }\n'
          d = d.replace(fill_marker, fill_marker + enhanced, 1)
          draw.write_text(d, encoding='utf-8')
          print('Touch 2: long-press marquee, edge scroll, selected-note glow, standalone identity')
          PYFINAL
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub hosted Ubuntu runner already includes Android SDK.
      # Avoid setup-android@v3, which tried to interactively accept unused Google TV SDK licenses.
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "::error::Android SDK directory not found: $SDK_ROOT"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using Android SDK at $SDK_ROOT"
          ls "$SDK_ROOT/build-tools" || true
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build signed standalone ARM64 APK
        run: >-
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj
          -f net9.0-android -c Release
          -p:TargetFrameworks=net9.0-android
          -p:RuntimeIdentifier=android-arm64
          -p:RuntimeIdentifiers=android-arm64
          -p:AndroidCreatePackagePerAbi=false
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=false
          -p:RunAOTCompilation=false
          -p:EmbedAssembliesIntoApk=true
          -bl:touch-build.binlog
      - name: Verify package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find OpenUtauMobile/bin/Release -name '*-Signed.apk' -print -quit)
          test -n "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee package.txt
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > manifest-tree.txt
          grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.documents' manifest-tree.txt
          if grep -Fq 'pers.vocoder712.openutaumobile.documents' manifest-tree.txt; then
            echo '::error::Original DocumentsProvider authority is still in modified APK'
            exit 1
          fi
          grep -q "package: name='pers.vocoder712.openutaumobile.touchmarquee.v2'" package.txt
          grep -q "application-label:'OpenUtau Touch 2'" package.txt
          grep -q "native-code:.*'arm64-v8a'" package.txt
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > manifest-tree.txt
          grep -q 'pers.vocoder712.openutaumobile.touchmarquee.v2.documents' manifest-tree.txt
          ! grep -q 'pers.vocoder712.openutaumobile.documents' manifest-tree.txt
          mkdir -p artifacts
          cp "$APK" artifacts/OpenUtau-Touch-2-ARM64.apk
          cp signature.txt package.txt manifest-tree.txt artifacts/
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-Touch-2-ARM64
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: touch-build-diagnostics
          path: touch-build.binlog
