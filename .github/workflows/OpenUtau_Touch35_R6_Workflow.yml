    - name: Verify package and signature
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch35-r6-build/step_69.sh"
    - name: Verify 132 rendered singer WAVs inside APK
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch35-r6-build/step_70.sh"
    - uses: actions/upload-artifact@v4
      with:
        name: OpenUTAU-Touch-35-R6-ARM64
        path: artifacts/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: OpenUTAU-Touch-35-R6-BuildLogs
        path: touch-build.binlog
'on':
  workflow_dispatch: null
