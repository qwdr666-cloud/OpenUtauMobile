      run: bash -e "$GITHUB_WORKSPACE/.touch35-r6-build/step_57.sh"
    - name: Touch 35 R6 - transactional voicebank installation and DiffSinger keyboard
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch35-r6-build/step_58.sh"
    - name: Load pinned host Worldline for bundled voice rendering
      uses: actions/checkout@v4
      with:
        repository: openutau/OpenUtau
        ref: 9b44e92145b1e35b49765db432246d256dccc30a
        path: .touch35-worldline
        sparse-checkout: 'runtimes/linux-x64/native/libworldline.so

          LICENSE.txt'
        sparse-checkout-cone-mode: false
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Bake all 132 default singer WAVs and test actual C# native renderer
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch35-r6-build/step_61.sh"
    - name: Test singer preparation and installation regressions
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch35-r6-build/step_62.sh"
    - name: Test real ZIP installer and DiffSinger ONNX keyboard inference
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch35-r6-build/step_63.sh"
    - name: Test shared Android audio device lifecycle with platform doubles
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch35-r6-build/step_64.sh"
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Use preinstalled Android SDK
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch35-r6-build/step_66.sh"
    - name: Install MAUI Android workload
      run: bash -e "$GITHUB_WORKSPACE/.touch35-r6-build/step_67.sh"
