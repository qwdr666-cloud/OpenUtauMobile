    - name: Verify and extract cumulative build scripts
      shell: bash
      run: "python - <<'PYUNPACKBUILD'\nfrom pathlib import Path\nimport base64,zlib,hashlib,json\nfolder=Path('.touch35-r6-build')\n\
        raw=zlib.decompress(base64.b64decode((folder/'scripts.b64').read_bytes(),validate=True))\nassert hashlib.sha256(raw).hexdigest()=='95a07cbb5940e55a1f0371cc01b578e304b9e3518670f6a1d013413057d90b84'\n\
        scripts=json.loads(raw)\nassert len(scripts)==65\nfor name,code in scripts.items():\n    assert name.isdigit()\n\
        \    (folder/('step_'+name+'.sh')).write_text(code,encoding='utf-8')\nprint('PASS cumulative build script\
        \ checksum')\nPYUNPACKBUILD\n"
