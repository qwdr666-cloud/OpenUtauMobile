              private void ExpressionCanvas_Touch(object sender,''',
                  '''        DrawTouch7LinePreview(canvas);
              }

              private void ExpressionCanvas_Touch(object sender,''','preview for noncurve parameters')

              s=replace_exact(s,
                  '''        else if (sender == ButtonSwitchExpressionEraserMode)
