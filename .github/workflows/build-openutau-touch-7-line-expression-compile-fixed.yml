                  if fragment.count(needle)!=1: raise RuntimeError(desc+': expected one Eraser branch')
                  fragment=fragment.replace(needle,code+needle)
                  return s[:start]+fragment+s[finish:]

              # On tap, both straight-line and freehand should update a single point.
              s=insert_case(s,
                  '_expressionGestureProcessor.Tap +=',
                  '_expressionGestureProcessor.DoubleTap +=',
                  '''                case EditViewModel.ExpressionEditMode.Line:
                              _viewModel.StartDrawExpression(e.Position, (float)ExpressionCanvas.Height);
                              _viewModel.UpdateDrawExpression(e.Position, (float)ExpressionCanvas.Height);
                              _viewModel.EndDrawExpression();
                              ExpressionCanvas.InvalidateSurface();
                              break;
          ''','line tap')
              s=insert_case(s,
                  '_expressionGestureProcessor.PanStart +=',
                  '_expressionGestureProcessor.PanUpdate +=',
                  '''                case EditViewModel.ExpressionEditMode.Line:
                              // Keep the underlying curve unchanged during drag.
                              _touch7LineStart = e.StartPosition;
                              _touch7LineEnd = e.StartPosition;
                              _touch7LinePreview = true;
                              ExpressionCanvas.InvalidateSurface();
                              break;
          ''','line drag start')
              s=insert_case(s,
                  '_expressionGestureProcessor.PanUpdate +=',
                  '_expressionGestureProcessor.PanEnd +=',
                  '''                case EditViewModel.ExpressionEditMode.Line:
                              if (_touch7LinePreview)
                              {
                                  _touch7LineEnd = e.Position;
                                  ExpressionCanvas.InvalidateSurface();
                              }
                              break;
