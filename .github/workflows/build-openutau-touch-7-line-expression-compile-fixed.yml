                          string degree = MusicMath.NumberedNotations[numberedNotationIndex];
                          font.Size = Math.Max(7f, Math.Min(keyRowHeight * 0.22f, width * 0.30f));
                          float degreeX = Math.Max(1f, (width - font.MeasureText(degree)) * 0.5f);
                          Canvas.DrawText(degree, degreeX, y + keyRowHeight * 0.28f, font, textPaint);
