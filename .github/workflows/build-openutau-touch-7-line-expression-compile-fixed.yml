                  '''    private readonly GestureProcessor _expressionGestureProcessor;
              private bool _touch7LinePreview;
              private SKPoint _touch7LineStart;
              private SKPoint _touch7LineEnd;

              private void DrawTouch7LinePreview(SKCanvas canvas)
              {
