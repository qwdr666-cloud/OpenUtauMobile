      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub hosted Ubuntu runner already includes Android SDK.
      # Avoid setup-android@v3, which tried to interactively accept unused Google TV SDK licenses.
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "::error::Android SDK directory not found: $SDK_ROOT"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using Android SDK at $SDK_ROOT"
          ls "$SDK_ROOT/build-tools" || true
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build signed standalone ARM64 APK
        run: >-
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj
          -f net9.0-android -c Release
          -p:TargetFrameworks=net9.0-android
          -p:RuntimeIdentifier=android-arm64
          -p:RuntimeIdentifiers=android-arm64
          -p:AndroidCreatePackagePerAbi=false
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=false
          -p:RunAOTCompilation=false
          -p:EmbedAssembliesIntoApk=true
          -bl:touch-build.binlog
      - name: Verify package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find OpenUtauMobile/bin/Release -name '*-Signed.apk' -print -quit)
          if [[ -z "$APK" ]]; then
            echo '::error::Signed APK not found in Release output'
            exit 1
          fi
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee package.txt
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > manifest-tree.txt

          # Only check Touch 7's identity. The previous Touch 1 authority check
          # was mistakenly left in the old workflow and caused exit code 1.
          grep -Fq "package: name='pers.vocoder712.openutaumobile.touchmarquee.v7'" package.txt || {
            echo '::error::Touch 7 package name mismatch'; exit 1;
          }
          grep -Fq "application-label:'OpenUtau Touch 7'" package.txt || {
            echo '::error::Touch 7 application label mismatch'; exit 1;
          }
          grep -Eq "native-code:.*'arm64-v8a'" package.txt || {
            echo '::error::Expected ARM64 native libraries not found'; exit 1;
          }
          grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v7.documents' manifest-tree.txt || {
            echo '::error::Touch 7 DocumentsProvider authority not found'; exit 1;
          }
          if grep -Fq 'pers.vocoder712.openutaumobile.documents' manifest-tree.txt || \
             grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.documents' manifest-tree.txt || \
             grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v2.documents' manifest-tree.txt || \
             grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v3.documents' manifest-tree.txt || \
             grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v4.documents' manifest-tree.txt || \
             grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v5.documents' manifest-tree.txt || \
             grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v6.documents' manifest-tree.txt; then
            echo '::error::An original or older Touch DocumentsProvider authority remains'
            exit 1
          fi
          echo 'All APK identity and coexistence checks passed.'
          mkdir -p artifacts
          cp "$APK" artifacts/OpenUtau-Touch-7-Line-Tool-ARM64.apk
          cp signature.txt package.txt manifest-tree.txt artifacts/
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-Touch-7-Line-Tool-ARM64
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: touch-build-diagnostics
          path: touch-build.binlog
