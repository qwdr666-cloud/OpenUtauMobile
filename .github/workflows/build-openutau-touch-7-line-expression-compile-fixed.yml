              s=insert_case(s,
                  '_expressionGestureProcessor.PanEnd +=',
                  '_expressionGestureProcessor.ZoomStart +=',
                  '''                case EditViewModel.ExpressionEditMode.Line:
                              if (_touch7LinePreview)
                              {
                                  _touch7LineEnd = e.EndPosition;
                                  _touch7LinePreview = false;
                                  if (_viewModel.EditingPart != null)
                                  {
                                      // Existing interpolation and undo commands commit the
                                      // full segment as one edit, not individual freehand points.
                                      _viewModel.StartDrawExpression(_touch7LineStart, (float)ExpressionCanvas.Height);
                                      _viewModel.UpdateDrawExpression(_touch7LineEnd, (float)ExpressionCanvas.Height);
                                      _viewModel.EndDrawExpression();
                                  }
                                  ExpressionCanvas.InvalidateSurface();
                              }
