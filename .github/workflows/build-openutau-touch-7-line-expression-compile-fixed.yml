                  using SKPaint line = new SKPaint
                  {
                      Color = ThemeColorsManager.Current.EditedExpressionStrokePaint.Color.WithAlpha(225),
                      StrokeWidth = 2.5f * (float)_viewModel.Density,
                      Style = SKPaintStyle.Stroke,
                      IsAntialias = true,
                  };
                  canvas.DrawLine(_touch7LineStart, _touch7LineEnd, line);
              }
          ''','line preview state and painter')

              def insert_case(s,begin,end,code,desc):
                  start = s.find(begin)
                  if start<0: raise RuntimeError(desc+': begin marker not found')
                  finish = s.find(end,start+len(begin))
                  if finish<0: raise RuntimeError(desc+': end marker not found')
