name: OpenUtau Touch 7 - compile fix PanEnd event
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: qwdr666-cloud/OpenUtauMobile
          ref: 17a86f602e054c345841684224903004eff1f536
          persist-credentials: false
      - name: Apply Touch source changes
        run: |
          python - <<'PYTHON'
          import base64, zlib
          from pathlib import Path
          Path('/tmp/touch.patch').write_bytes(zlib.decompress(base64.b64decode('')))
          PYTHON
          git apply --check /tmp/touch.patch
          git apply /tmp/touch.patch
      # Android requires unique ContentProvider authorities across all installed apps.
      # Original 1.1.7 hard-codes a DocumentsProvider authority independent of ApplicationId.
      - name: Isolate OpenUtau Touch documents provider
        shell: bash
        run: |
          python - <<'PYPROVIDER'
          from pathlib import Path
          path = Path('OpenUtauMobile/Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs')
          text = path.read_text(encoding='utf-8-sig')
          old = '["pers.vocoder712.openutaumobile.documents"]'
          new = '["pers.vocoder712.openutaumobile.touchmarquee.documents"]'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one original DocumentsProvider authority')
          text = text.replace(old, new)
          text = text.replace('ColumnTitle, "OpenUtau Mobile"', 'ColumnTitle, "OpenUtau Touch"')
          path.write_text(text, encoding='utf-8')
          print('Isolated DocumentsProvider authority:', new)
          PYPROVIDER
      - name: Upgrade to Touch 2 gestures and independent app identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYUPGRADE'
          import base64, zlib
          from pathlib import Path
          Path('/tmp/touch2.patch').write_bytes(zlib.decompress(base64.b64decode('')))
          PYUPGRADE
          git apply --check /tmp/touch2.patch
          git apply /tmp/touch2.patch
          python - <<'PYFINAL'
          from pathlib import Path

          # GitHub-hosted builds use temporary signing keys. Use a new package ID so
          # Touch 2 installs beside the existing Touch 1 and official OpenUtau Mobile.
          csproj = Path('OpenUtauMobile/OpenUtauMobile.csproj')
          c = csproj.read_text(encoding='utf-8-sig')
          old = '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee</ApplicationId>'
          assert c.count(old) == 1, 'Touch 1 package ID not found'
          c = c.replace(old, '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v2</ApplicationId>')
          assert c.count('<ApplicationTitle>OpenUtau Touch</ApplicationTitle>') == 1
          c = c.replace('<ApplicationTitle>OpenUtau Touch</ApplicationTitle>', '<ApplicationTitle>OpenUtau Touch 2</ApplicationTitle>')
          assert c.count('<ApplicationDisplayVersion>1.1.7</ApplicationDisplayVersion>') == 1
          c = c.replace('<ApplicationDisplayVersion>1.1.7</ApplicationDisplayVersion>', '<ApplicationDisplayVersion>1.1.8</ApplicationDisplayVersion>')
          assert c.count('<ApplicationVersion>16</ApplicationVersion>') == 1
          c = c.replace('<ApplicationVersion>16</ApplicationVersion>', '<ApplicationVersion>17</ApplicationVersion>')
          csproj.write_text(c, encoding='utf-8')

          manifest = Path('OpenUtauMobile/Platforms/Android/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8-sig')
          assert m.count('android:label="OpenUtau Touch"') == 1
          manifest.write_text(m.replace('android:label="OpenUtau Touch"', 'android:label="OpenUtau Touch 2"'), encoding='utf-8')

          provider = Path('OpenUtauMobile/Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs')
          p = provider.read_text(encoding='utf-8-sig')
          old_authority = 'pers.vocoder712.openutaumobile.touchmarquee.documents'
          assert p.count(old_authority) == 1, 'Touch 1 provider authority not found'
          p = p.replace(old_authority, 'pers.vocoder712.openutaumobile.touchmarquee.v2.documents')
          p = p.replace('ColumnTitle, "OpenUtau Touch"', 'ColumnTitle, "OpenUtau Touch 2"')
          provider.write_text(p, encoding='utf-8')

          # Brighten selected notes *after* painting the notes themselves.
          # The original border was drawn before the opaque note body, hiding it.
          draw = Path('OpenUtauMobile/Views/DrawableObjects/DrawableNotes.cs')
          d = draw.read_text(encoding='utf-8-sig')
          match = '            foreach (UNote note in Part.notes)'
          assert d.count(match) >= 2, 'Note rendering loop not found'
          glows = '            using SKPaint selectedLightFill = new()\n            {\n                Color = new SKColor(249, 254, 255, 112),\n                Style = SKPaintStyle.Fill,\n                IsAntialias = true,\n            };\n            using SKPaint selectedOuterGlow = new()\n            {\n                Color = new SKColor(91, 222, 255, 143),\n                Style = SKPaintStyle.Stroke,\n                StrokeWidth = 8f * (float)ViewModel.Density,\n                IsAntialias = true,\n            };\n            using SKPaint selectedBrightOutline = new()\n            {\n                Color = new SKColor(249, 253, 255, 255),\n                Style = SKPaintStyle.Stroke,\n                StrokeWidth = 2.5f * (float)ViewModel.Density,\n                IsAntialias = true,\n            };\n'
          d = d.replace(match, glows + match, 1)
          fill_marker = 'HeightPerPianoKey * ViewModel.PianoRollTransformer.ZoomY, paint);'
          assert d.count(fill_marker) == 1, 'Note body drawing call not found'
          enhanced = '\n                // Draw selected-note light last so the opaque body cannot cover it.\n                if (ViewModel.SelectedNotes.Contains(note))\n                {\n                    float x = (PositionX + note.position) * ViewModel.PianoRollTransformer.ZoomX + ViewModel.PianoRollTransformer.PanX;\n                    float y = (ViewConstants.TotalPianoKeys - note.tone - 1) * HeightPerPianoKey * ViewModel.PianoRollTransformer.ZoomY + ViewModel.PianoRollTransformer.PanY;\n                    float w = note.duration * ViewModel.PianoRollTransformer.ZoomX;\n                    float h = HeightPerPianoKey * ViewModel.PianoRollTransformer.ZoomY;\n                    Canvas.DrawRect(x, y, w, h, selectedLightFill);\n                    Canvas.DrawRect(x, y, w, h, selectedOuterGlow);\n                    Canvas.DrawRect(x, y, w, h, selectedBrightOutline);\n                }\n'
          d = d.replace(fill_marker, fill_marker + enhanced, 1)
          draw.write_text(d, encoding='utf-8')
          print('Touch 2: long-press marquee, edge scroll, selected-note glow, standalone identity')
          PYFINAL
      - name: Add kinetic scrolling, independent draggable piano-roll playhead
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYFEATURE'
          import base64,zlib
          from pathlib import Path
          Path('/tmp/touch3-feature.patch').write_bytes(zlib.decompress(base64.b64decode('')))
          PYFEATURE
          git apply --check /tmp/touch3-feature.patch
          git apply /tmp/touch3-feature.patch
          python - <<'PYIDENTITY'
          from pathlib import Path
          def swap_one(path, old, new):
              file = Path(path)
              content = file.read_text(encoding='utf-8-sig')
              if content.count(old) != 1:
                  raise RuntimeError(f'{file}: expected one match for {old!r}, got {content.count(old)}')
              file.write_text(content.replace(old,new),encoding='utf-8')

          # New package & DocumentsProvider authority: avoid collisions and
          # signature-update errors with the official, Touch 1 and Touch 2 apps.
          csproj='OpenUtauMobile/OpenUtauMobile.csproj'
          swap_one(csproj,'<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v2</ApplicationId>',
                     '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v3</ApplicationId>')
          swap_one(csproj,'<ApplicationTitle>OpenUtau Touch 2</ApplicationTitle>',
                     '<ApplicationTitle>OpenUtau Touch 3</ApplicationTitle>')
          swap_one(csproj,'<ApplicationDisplayVersion>1.1.8</ApplicationDisplayVersion>',
                     '<ApplicationDisplayVersion>1.1.9</ApplicationDisplayVersion>')
          swap_one(csproj,'<ApplicationVersion>17</ApplicationVersion>',
                     '<ApplicationVersion>18</ApplicationVersion>')
          swap_one('OpenUtauMobile/Platforms/Android/AndroidManifest.xml',
                     'android:label="OpenUtau Touch 2"','android:label="OpenUtau Touch 3"')
          provider='OpenUtauMobile/Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs'
          swap_one(provider, 'pers.vocoder712.openutaumobile.touchmarquee.v2.documents',
                     'pers.vocoder712.openutaumobile.touchmarquee.v3.documents')
          swap_one(provider, 'ColumnTitle, "OpenUtau Touch 2"', 'ColumnTitle, "OpenUtau Touch 3"')

          # Overlay remains transparent to touch, so the existing note gesture
          # handler receives taps and can perform playhead hit-testing.
          xaml='OpenUtauMobile/Views/EditPage.xaml'
          match='<skia:SKCanvasView x:Name="PianoRollPitchCanvas" Grid.Column="1" PaintSurface="PianoRollPitchCanvas_PaintSurface"/>'
          extra='<skia:SKCanvasView x:Name="PianoRollPlayheadCanvas" Grid.Column="1" InputTransparent="True" PaintSurface="PianoRollPlayheadCanvas_PaintSurface"/>'
          swap_one(xaml, match, match+'\n                         '+extra)
          # Old implementation paints a permanent cursor line at a fixed X.
          # Remove it: the new overlay paints the cursor at actual play time.
          draw='OpenUtauMobile/Views/DrawableObjects/DrawablePianoRollTickBackground.cs'
          swap_one(draw, 'float posX = (float)DeviceDisplay.Current.MainDisplayInfo.Density * ViewConstants.PianoRollPlaybackLinePos;\n            Canvas.DrawLine(new SKPoint(posX, 0), new SKPoint(posX, bottom + 0.5f), ThemeColorsManager.Current.PianoRollPlaybackPosLinePaint);',
                         '// Cursor is drawn on PianoRollPlayheadCanvas at PlayPosTick.')
          print('Touch 3: kinetic scrolling, movable seek line, standalone application identity')
          PYIDENTITY
      - name: Fix Touch 3 SkiaSharp touch action namespace
        shell: bash
        run: |
          python - <<'PYFIX'
          from pathlib import Path
          file = Path('OpenUtauMobile/Views/EditPage.xaml.cs')
          source = file.read_text(encoding='utf-8-sig')
          required = 'using SkiaSharp.Views.Maui;'
          if required not in source:
              anchor = 'using SkiaSharp;'
              if source.count(anchor) != 1:
                  raise SystemExit('Could not locate SkiaSharp import in EditPage.xaml.cs')
              source = source.replace(anchor, anchor + '\n' + required, 1)
              file.write_text(source, encoding='utf-8')
          assert 'using SkiaSharp.Views.Maui;' in source
          assert source.count('SKTouchAction.') >= 9
          print('Added SkiaSharp.Views.Maui namespace used by SKTouchAction enum')
          PYFIX
      - name: Add playhead follow toggle, black playhead, marquee without button
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTOUCH4'
          from pathlib import Path
          
          ROOT=Path('OpenUtauMobile')
          
          def swap_one(file, old, new):
              path=ROOT/file
              s=path.read_text(encoding='utf-8-sig')
              count=s.count(old)
              if count!=1:
                  raise RuntimeError(f'{path}: expected exactly one occurrence, got {count}, for {old[:160]!r}')
              path.write_text(s.replace(old,new),encoding='utf-8')
          
          def change(file, action):
              path=ROOT/file
              source=path.read_text(encoding='utf-8-sig')
              output=action(source)
              if output==source: raise RuntimeError(f'No change applied to {path}')
              path.write_text(output,encoding='utf-8')
          
          # Add separately installable Touch 4 identity.
          swap_one('OpenUtauMobile.csproj',
                   '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v3</ApplicationId>',
                   '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v4</ApplicationId>')
          swap_one('OpenUtauMobile.csproj','<ApplicationTitle>OpenUtau Touch 3</ApplicationTitle>',
                   '<ApplicationTitle>OpenUtau Touch 4</ApplicationTitle>')
          swap_one('OpenUtauMobile.csproj','<ApplicationDisplayVersion>1.1.9</ApplicationDisplayVersion>',
                   '<ApplicationDisplayVersion>1.1.10</ApplicationDisplayVersion>')
          swap_one('OpenUtauMobile.csproj','<ApplicationVersion>18</ApplicationVersion>',
                   '<ApplicationVersion>19</ApplicationVersion>')
          swap_one('Platforms/Android/AndroidManifest.xml','android:label="OpenUtau Touch 3"',
                   'android:label="OpenUtau Touch 4"')
          swap_one('Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs',
                   'pers.vocoder712.openutaumobile.touchmarquee.v3.documents',
                   'pers.vocoder712.openutaumobile.touchmarquee.v4.documents')
          swap_one('Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs',
                   'ColumnTitle, "OpenUtau Touch 3"', 'ColumnTitle, "OpenUtau Touch 4"')
          
          # Replace the central pitch-anchor button in the four-button note editing toolbar.
          # It remains a Button with the exact original styling and dimensions.
          swap_one('Views/EditPage.xaml',
                   '<Button ImageSource="{DynamicResource anchor}" WidthRequest="25" Grid.Column="3" x:Name="ButtonSwitchEditPitchAnchorMode" Style="{StaticResource NoteEditModeButtonStyle}" Clicked="ButtonSwitchNoteMode_Clicked" Padding="12"/>',
                   '<Button ImageSource="followplayhead.png" WidthRequest="25" Grid.Column="3" x:Name="ButtonFollowPlayhead" Style="{StaticResource NoteEditModeButtonStyle}" Clicked="ButtonFollowPlayhead_Clicked" Padding="12" SemanticProperties.Description="播放时跟随指针（点击开关）" />')
          
          # .NET MAUI processes the SVG icon into PNG at build time using MauiImage.
          icon=ROOT/'Resources/Images/followplayhead.svg'
          icon.parent.mkdir(parents=True,exist_ok=True)
          icon.write_text('''<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
            <g fill="none" stroke="#181818" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
              <path d="M12 3V21"/>
              <path d="M3 8V16M21 8V16"/>
              <path d="M5.5 12H9.5M14.5 12H18.5"/>
              <path d="m7.5 10 2 2-2 2M16.5 10l-2 2 2 2"/>
            </g>
          </svg>''',encoding='utf-8')
          
          # Follow is a standalone toggle, not a pitch-edit mode. Keep default on to
          # preserve Touch 3's behavior until the user presses the button.
          swap_one('Views/EditPage.xaml.cs',
                   '    private bool _pianoPlayheadDragging;',
                   '    private bool _followPianoPlayhead = true;\n    private bool _pianoPlayheadDragging;')
          swap_one('Views/EditPage.xaml.cs',
                   'ButtonSwitchEditPitchAnchorMode.BackgroundColor = mode == EditViewModel.NoteEditMode.EditPitchAnchor ? activeColor : Colors.Transparent;',
                   'ButtonFollowPlayhead.BackgroundColor = _followPianoPlayhead ? activeColor : Colors.Transparent;')
          swap_one('Views/EditPage.xaml.cs',
                   'if (_viewModel.Playing && !_pianoPlayheadDragging)',
                   'if (_followPianoPlayhead && _viewModel.Playing && !_pianoPlayheadDragging)')
          
          # Replace old pitch anchor handler branch and add a function to update active style.
          swap_one('Views/EditPage.xaml.cs',
                   '''        else if (sender == ButtonSwitchEditPitchAnchorMode)
                  {
                      _viewModel.CurrentNoteEditMode = EditViewModel.NoteEditMode.EditPitchAnchor;
                  }
          ''', '')
          swap_one('Views/EditPage.xaml.cs',
                   '    private void ButtonSwitchNoteMode_Clicked(object sender, EventArgs e)',
                   '''    private void ButtonFollowPlayhead_Clicked(object sender, EventArgs e)
              {
                  _followPianoPlayhead = !_followPianoPlayhead;
                  SKColorMauiColorConverter converter = new();
                  Color? activeColor = converter.Convert(
                      ThemeColorsManager.Current.ActiveNoteEditModeButton,
                      typeof(Color), null, null!) as Color;
                  ButtonFollowPlayhead.BackgroundColor = _followPianoPlayhead
                      ? activeColor : Colors.Transparent;
                  // The current play position and scroll state remain untouched.
                  // On the next playback tick, enabled follow resumes automatically.
              }
          
              private void ButtonSwitchNoteMode_Clicked(object sender, EventArgs e)''')
          
          # Playhead: fully black line with a small vertical rectangle at top.
          # Using rect (not a triangle) also increases the visible grab-target clarity.
          swap_one('Views/EditPage.xaml.cs',
                   'Color = new SKColor(179, 243, 83, 195), StrokeWidth = 2f * density,',
                   'Color = SKColors.Black, StrokeWidth = 2f * density,')
          swap_one('Views/EditPage.xaml.cs',
                   'Color = new SKColor(179, 243, 83, 255),',
                   'Color = SKColors.Black,')
          swap_one('Views/EditPage.xaml.cs',
                   '''        using var shape = new SKPath();
                  shape.MoveTo(x - 11 * density, 0);
                  shape.LineTo(x + 11 * density, 0);
                  shape.LineTo(x, 17 * density);
                  shape.Close();
                  canvas.DrawPath(shape, handle);''',
                   '''        // Small upright rectangular grip; keep the cursor centered.
                  canvas.DrawRoundRect(new SKRect(x - 5f * density, 0,
                      x + 5f * density, 18f * density), 1.5f * density,
                      1.5f * density, handle);''')
          
          # Long-press empty piano roll for 500ms then move = marquee in BOTH single
          # and multi selection modes. Ordinary swipes and note drags stay unchanged.
          swap_one('Views/EditPage.xaml.cs',
                   '''            _viewModel.CurrentSelectMode == EditViewModel.SelectionMode.Multi &&
                      _viewModel.CurrentNoteEditMode == EditViewModel.NoteEditMode.EditNote &&''',
                   '''            _viewModel.CurrentNoteEditMode == EditViewModel.NoteEditMode.EditNote &&''')
          swap_one('Views/EditPage.xaml.cs',
                   '''                    if (_viewModel.CurrentSelectMode == EditViewModel.SelectionMode.Multi &&
                                  _viewModel.EditingNotes != null && _viewModel.EditingPart != null)''',
                   '''                    if (_viewModel.EditingNotes != null && _viewModel.EditingPart != null)''')
          swap_one('Views/EditPage.xaml.cs',
                   '''        if (!_marqueeActive || _viewModel.CurrentSelectMode != EditViewModel.SelectionMode.Multi)
          ''',
                   '''        if (!_marqueeActive || _viewModel.CurrentNoteEditMode != EditViewModel.NoteEditMode.EditNote)
          ''')
          
          # Verify no obsolete toolbar button name remains.
          s=(ROOT/'Views/EditPage.xaml.cs').read_text(encoding='utf-8')
          x=(ROOT/'Views/EditPage.xaml').read_text(encoding='utf-8')
          assert 'ButtonSwitchEditPitchAnchorMode' not in (s+x)
          assert 'ButtonFollowPlayhead_Clicked' in s and 'ButtonFollowPlayhead' in x
          assert 'if (_followPianoPlayhead && _viewModel.Playing' in s
          assert 'if (_viewModel.EditingNotes != null && _viewModel.EditingPart != null)' in s
          assert 'canvas.DrawRoundRect(new SKRect(x - 5f' in s
          assert icon.exists()
          print('Touch 4 customization applied and validated')
          PYTOUCH4
      - name: Touch 5 transparent toolbars, compact piano keys and grey playhead
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTOUCH5'
          from pathlib import Path
          import re
          
          ROOT = Path('OpenUtauMobile')
          
          def edit(relative, fn):
              path = ROOT / relative
              source = path.read_text(encoding='utf-8-sig')
              output = fn(source)
              if output == source:
                  raise RuntimeError(f'Nothing changed: {path}')
              path.write_text(output, encoding='utf-8')
          
          def once(source, old, new, desc):
              n = source.count(old)
              if n != 1:
                  raise RuntimeError(f'{desc}: wanted exactly one match, got {n}: {old[:110]!r}')
              return source.replace(old, new, 1)
          
          # Touch 5 has its own Android identity so it can coexist with Touch 1..4.
          def identity(s):
              for old,new in [
                  ('<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v4</ApplicationId>',
                   '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v5</ApplicationId>'),
                  ('<ApplicationTitle>OpenUtau Touch 4</ApplicationTitle>',
                   '<ApplicationTitle>OpenUtau Touch 5</ApplicationTitle>'),
                  ('<ApplicationDisplayVersion>1.1.10</ApplicationDisplayVersion>',
                   '<ApplicationDisplayVersion>1.1.11</ApplicationDisplayVersion>'),
                  ('<ApplicationVersion>19</ApplicationVersion>', '<ApplicationVersion>20</ApplicationVersion>'),
              ]:
                  s=once(s,old,new,'Touch 5 identity')
              return s
          edit('OpenUtauMobile.csproj',identity)
          edit('Platforms/Android/AndroidManifest.xml',lambda s: once(s,'android:label="OpenUtau Touch 4"','android:label="OpenUtau Touch 5"','manifest label'))
          def provider(s):
              s=once(s,'pers.vocoder712.openutaumobile.touchmarquee.v4.documents',
                  'pers.vocoder712.openutaumobile.touchmarquee.v5.documents','provider authority')
              return once(s,'ColumnTitle, "OpenUtau Touch 4"','ColumnTitle, "OpenUtau Touch 5"','provider title')
          edit('Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs', provider)
          
          # One visual group per row: hide *both* floating tools and their backgrounds.
          # Parent opacity applies to the pink background and black icons alike, and
          # parent IsVisible blocks touch events when the overlay is hidden.
          def xaml(s):
              # Match by distinctive row definitions, rather than whitespace-sensitive XML.
              s,n = re.subn(
                  r'<Grid(?=\s+AbsoluteLayout\.LayoutBounds="1,0,AutoSize,AutoSize")(?=[^>]*RowDefinitions="40,40,40")',
                  '<Grid x:Name="Touch5TrackOverlay" Opacity="0.56"', s, count=1)
              if n != 1: raise RuntimeError('Track floating toolbar was not found')
              s,n = re.subn(
                  r'<Grid(?=\s+AbsoluteLayout\.LayoutBounds="1,0,AutoSize,AutoSize")(?=[^>]*RowDefinitions="Auto, Auto")',
                  '<Grid x:Name="Touch5PianoOverlay" Opacity="0.56"', s, count=1)
              if n != 1: raise RuntimeError('Piano floating toolbar was not found')
              s=once(s,
                  '<Button ImageSource="{DynamicResource sine}" WidthRequest="25" Grid.Column="4" x:Name="ButtonSwitchEditVibratoMode" Style="{StaticResource NoteEditModeButtonStyle}" Clicked="ButtonSwitchNoteMode_Clicked" Padding="12" />',
                  '<Button ImageSource="touch5_eye_off.png" WidthRequest="25" Grid.Column="4" x:Name="ButtonToggleFloatingTools" Style="{StaticResource NoteEditModeButtonStyle}" Clicked="ButtonToggleFloatingTools_Clicked" Padding="12" SemanticProperties.Description="隐藏或显示右侧悬浮工具按钮" />',
                  'fourth toolbar button')
              # Maintain alignment of the piano keyboard, pitch expression strip and drag handles.
              for old,new,desc in [
                  ('<Grid x:Name="GridPianoRoll" ColumnDefinitions="60, *"',
                   '<Grid x:Name="GridPianoRoll" ColumnDefinitions="30, *"','piano key column'),
                  ('<Grid ColumnDefinitions="60,*" Padding="0" >',
                   '<Grid ColumnDefinitions="30,*" Padding="0" >','divider key column'),
                  ('<Grid x:Name="BorderExtend" ColumnDefinitions="60,*"',
                   '<Grid x:Name="BorderExtend" ColumnDefinitions="30,*"','expression key column'),
                  ('<Grid ColumnDefinitions="60,8,*,Auto,100" Padding="0" >',
                   '<Grid ColumnDefinitions="30,8,*,Auto,100" Padding="0" >','expression toolbar key column'),
              ]:
                  s=once(s,old,new,desc)
              return s
          edit('Views/EditPage.xaml', xaml)
          
          icons={
           'touch5_eye_off.svg':'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><g fill="none" stroke="#181818" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.2A11.3 11.3 0 0 1 12 5c5.2 0 8.9 4.2 10 7-.5 1.4-1.6 3-3 4.2"/><path d="M6.7 6.7C4.1 8.2 2.5 10.5 2 12c1.1 2.8 4.8 7 10 7 1.2 0 2.3-.2 3.3-.5"/><path d="M10 10a3 3 0 0 0 4 4"/></g></svg>''',
           'touch5_eye_on.svg':'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><g fill="none" stroke="#181818" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g></svg>'''
          }
          for name,body in icons.items():
              icon=ROOT/'Resources'/'Images'/name
              icon.parent.mkdir(parents=True,exist_ok=True)
              icon.write_text(body,encoding='utf-8')
          
          # The fourth note toolbar control is now a real visibility toggle, not
          # an editing mode; its icon indicates the action available on the next tap.
          def csharp(s):
              s=once(s,
                  'ButtonSwitchEditVibratoMode.BackgroundColor = mode == EditViewModel.NoteEditMode.EditVibrato ? activeColor : Colors.Transparent;',
                  'ButtonToggleFloatingTools.BackgroundColor = Colors.Transparent;',
                  'toolbar state update')
              pattern=r'\s*else if \(sender == ButtonSwitchEditVibratoMode\)\s*\{\s*_viewModel\.CurrentNoteEditMode = EditViewModel\.NoteEditMode\.EditVibrato;\s*\}'
              s,n=re.subn(pattern,'\n        ',s,count=1)
              if n!=1: raise RuntimeError('Cannot locate the original vibrato button handler')
              handler='''    private bool _touch5SideToolsVisible = true;
          
              private void ButtonToggleFloatingTools_Clicked(object sender, EventArgs e)
              {
                  _touch5SideToolsVisible = !_touch5SideToolsVisible;
                  Touch5TrackOverlay.IsVisible = _touch5SideToolsVisible;
                  Touch5PianoOverlay.IsVisible = _touch5SideToolsVisible;
                  ButtonToggleFloatingTools.ImageSource = _touch5SideToolsVisible
                      ? "touch5_eye_off.png" : "touch5_eye_on.png";
              }
          
          '''
              s=once(s,'    private void ButtonSwitchNoteMode_Clicked(object sender, EventArgs e)',
                  handler+'    private void ButtonSwitchNoteMode_Clicked(object sender, EventArgs e)',
                  'floating tool visibility callback')
              # Touch 4's dark-black playhead had separate line/handle colors.
              s=once(s,'Color = SKColors.Black, StrokeWidth = 2f * density,',
                  'Color = new SKColor(60, 60, 64, 172), StrokeWidth = 2f * density,',
