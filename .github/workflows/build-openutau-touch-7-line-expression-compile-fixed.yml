          from pathlib import Path
          import re

          root = Path('OpenUtauMobile')
          def modify(relative, fn):
              file = root / relative
              previous = file.read_text(encoding='utf-8-sig')
              updated = fn(previous)
              if updated == previous:
                  raise RuntimeError(f'No modifications made to {file}')
              file.write_text(updated, encoding='utf-8')

          def swap(source, before, after, desc, count=1):
              occurrences = source.count(before)
              if occurrences != count:
                  raise RuntimeError(f'{desc}: expected {count} occurrences, found {occurrences}')
              return source.replace(before, after)

          # Give this release a distinct package/provider: previous versions coexist.
          def update_identity(s):
              for old, new in (
                  ('<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v5</ApplicationId>',
                   '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v6</ApplicationId>'),
                  ('<ApplicationTitle>OpenUtau Touch 5</ApplicationTitle>',
                   '<ApplicationTitle>OpenUtau Touch 6</ApplicationTitle>'),
                  ('<ApplicationDisplayVersion>1.1.11</ApplicationDisplayVersion>',
                   '<ApplicationDisplayVersion>1.1.12</ApplicationDisplayVersion>'),
                  ('<ApplicationVersion>20</ApplicationVersion>',
                   '<ApplicationVersion>21</ApplicationVersion>'),
              ):
                  s = swap(s,old,new,'Touch 6 app identity')
              return s
          modify('OpenUtauMobile.csproj',update_identity)
          modify('Platforms/Android/AndroidManifest.xml',lambda s: swap(
              s,'android:label="OpenUtau Touch 5"','android:label="OpenUtau Touch 6"',
              'Touch 6 Android manifest'))
          def update_provider(s):
              s=swap(s,'pers.vocoder712.openutaumobile.touchmarquee.v5.documents',
                  'pers.vocoder712.openutaumobile.touchmarquee.v6.documents',
                  'Touch 6 DocumentsProvider authority')
              return swap(s,'ColumnTitle, "OpenUtau Touch 5"',
                  'ColumnTitle, "OpenUtau Touch 6"','Touch 6 DocumentsProvider title')
          modify('Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs',update_provider)

          def fix_layout(s):
              # Keep the actual piano keyboard at 30 dp. The adjacent UI elements
              # were incorrectly shrunk by Touch 5 and must stay at their original 60 dp.
              s=swap(s,'<Grid ColumnDefinitions="30,*" Padding="0" >',
                  '<Grid ColumnDefinitions="60,*" Padding="0" >',
                  'original-size piano divider handle')
              s=swap(s,'<Grid x:Name="BorderExtend" ColumnDefinitions="30,*"',
                  '<Grid x:Name="BorderExtend" ColumnDefinitions="60,*"',
                  'full-size expression left panel')
              s=swap(s,'<Grid ColumnDefinitions="30,8,*,Auto,100" Padding="0" >',
                  '<Grid ColumnDefinitions="60,8,*,Auto,100" Padding="0" >',
                  'original-size expression toolbar drag handle')
              # Four floating pink buttons (two groups), both background and icon.
              s=swap(s,'Opacity="0.56"','Opacity="0.75"',
                  '75% opacity of both floating tool groups',count=2)
              # Keep controls readable in the restored 60-dp-wide parameter panel.
              for name in ('ButtonExchangeExp', 'ButtonSwitchExpressionHandMode',
                           'ButtonSwitchExpressionEditMode', 'ButtonSwitchExpressionEraserMode'):
                  pattern = r'(<Button\b(?=[^>]*\bx:Name="' + re.escape(name) + r'")[^>]*)(/>)'
                  def adjust(m):
                      body=m.group(1)
                      if 'FontSize=' in body:
                          raise RuntimeError('Unexpected existing font size on ' + name)
                      body += ' FontSize="13"'
                      if 'LineBreakMode=' not in body:
                          body += ' LineBreakMode="CharacterWrap"'
                      return body + m.group(2)
                  s,n=re.subn(pattern,adjust,s,count=1)
                  if n!=1: raise RuntimeError(f'Cannot locate parameter button {name}')
              if '<Grid x:Name="GridPianoRoll" ColumnDefinitions="30, *"' not in s:
                  raise RuntimeError('Piano keyboard must remain at 30 dp')
              return s
          modify('Views/EditPage.xaml',fix_layout)

          def fix_key_label(s):
              # Allow slight visual overlap with the lower numbered-notation degree.
              s=swap(s,
                  'font.Size = Math.Max(8f, Math.Min(keyRowHeight * 0.34f, width * 0.39f));',
                  'font.Size = Math.Max(10f, Math.Min(keyRowHeight * 0.48f, width * 0.58f));',
                  'make pitch names considerably larger')
