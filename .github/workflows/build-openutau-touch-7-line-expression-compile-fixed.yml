          """Run AFTER OpenUtau Touch 6's workflow modifications have been applied.
          Adds centered piano key names and lower-right degree labels, smaller playhead tab,
          and a line-expression drawing tool integrated into normal undo grouping.
          """
          from pathlib import Path
          import re

          ROOT = Path('OpenUtauMobile')

          def edit(relative, callback):
              filename = ROOT / relative
              old = filename.read_text(encoding='utf-8-sig')
              new = callback(old)
              if old == new:
                  raise RuntimeError('No modifications applied to ' + str(filename))
              filename.write_text(new, encoding='utf-8')

          def replace_exact(s, old, new, reason, count=1):
              n=s.count(old)
              if n!=count:
                  raise RuntimeError(f'{reason}: expected {count} matches, got {n} - {old[:135]!r}')
              return s.replace(old, new)

          # Installation namespace is unique, keeps v6 and official app untouched.
          def change_app_id(s):
              for old,new in (
                  ('<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v6</ApplicationId>',
                   '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v7</ApplicationId>'),
                  ('<ApplicationTitle>OpenUtau Touch 6</ApplicationTitle>',
                   '<ApplicationTitle>OpenUtau Touch 7</ApplicationTitle>'),
                  ('<ApplicationDisplayVersion>1.1.12</ApplicationDisplayVersion>',
                   '<ApplicationDisplayVersion>1.1.13</ApplicationDisplayVersion>'),
                  ('<ApplicationVersion>21</ApplicationVersion>',
                   '<ApplicationVersion>22</ApplicationVersion>'),
              ):
                  s=replace_exact(s,old,new,'Touch 7 app identity')
              return s
          edit('OpenUtauMobile.csproj',change_app_id)
          edit('Platforms/Android/AndroidManifest.xml',lambda s: replace_exact(s,
              'android:label="OpenUtau Touch 6"','android:label="OpenUtau Touch 7"','Android manifest label'))
          def provider(s):
              s=replace_exact(s,
                  'pers.vocoder712.openutaumobile.touchmarquee.v6.documents',
                  'pers.vocoder712.openutaumobile.touchmarquee.v7.documents','DocumentsProvider unique authority')
              return replace_exact(s,'ColumnTitle, "OpenUtau Touch 6"',
                  'ColumnTitle, "OpenUtau Touch 7"','DocumentsProvider UI title')
          edit('Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs', provider)

          # Add the sixth row in the expression-tools scroll panel; editing area stays 60 dp.
          def update_layout(s):
              s=replace_exact(s,
                  '<Grid RowDefinitions="30,30,30,30,30" ColumnDefinitions="20,20,20" >',
                  '<Grid RowDefinitions="30,30,30,30,30,30" ColumnDefinitions="20,20,20" >',
                  'six expression-tool rows')
              pattern = r'(<Button x:Name="ButtonSwitchExpressionEraserMode" Grid.Row=")4("[^\n]*?/>)'
              sub='''<Button x:Name="ButtonSwitchExpressionLineMode" Grid.Row="4" Grid.Column="0" Grid.ColumnSpan="3" Text="直线" FontSize="13" LineBreakMode="NoWrap" Padding="0" BackgroundColor="Transparent" Clicked="ButtonSwitchExpressionEditMode_Clicked" SemanticProperties.Description="画一条直线参数段"/>
                                          \\g<1>5\\g<2>'''
              s,n=re.subn(pattern,sub,s,count=1)
