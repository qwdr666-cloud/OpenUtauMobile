          def viewmodel(s):
              old='''            // 编辑模式
                      Edit,
                      // 橡皮擦模式
                      Eraser,'''
              new='''            // 编辑模式
                      Edit,
                      // 拖拽绘制直线段
                      Line,
                      // 橡皮擦模式
                      Eraser,'''
              return replace_exact(s,old,new,'expression edit mode enum')
          edit('ViewModels/EditViewModel.cs',viewmodel)

          # The C# behind uses Skia pixel coordinates to draw both names and grades.
          def update_code(s):
              # Touch 6 made the label large but positioned it above the center and degree in center-bottom.
              old='''            float nameX = Math.Max(1f, (width - font.MeasureText(keyName)) * 0.5f);
                      Canvas.DrawText(keyName, nameX, y - keyRowHeight * 0.09f, font, textPaint);
                      if (numberedNotationIndex >= 0 && numberedNotationIndex <= 11)
