    - name: Touch 31 - Fixed maximum piano surfaces and clipped viewport
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_35.sh"
    - name: Touch 32 - Direct translated and clipped divider drag
