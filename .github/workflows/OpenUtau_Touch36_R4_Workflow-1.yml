      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_39.sh"
    - name: Touch 33 correction - idle divider snapshots and portable default singer
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_40.sh"
    - name: Touch33 improvement 2 - exact expression line and frame-coalesced divider
