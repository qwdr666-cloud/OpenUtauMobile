      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_79.sh"
    - name: Test shared Android audio device lifecycle with platform doubles
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_64.sh"
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Use preinstalled Android SDK
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_66.sh"
    - name: Install MAUI Android workload
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_67.sh"
    - name: Build signed standalone ARM64 APK
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_68.sh"
    - name: Verify package and signature
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_69.sh"
    - name: Verify 132 rendered singer WAVs inside APK
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_70.sh"
    - uses: actions/upload-artifact@v4
      with:
        name: OpenUTAU-Touch-36-R4-ARM64
        path: artifacts/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
