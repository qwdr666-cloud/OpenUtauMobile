      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_17.sh"
    - name: Touch 14 - temporary horizontal-only and vertical-only buttons
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_18.sh"
    - name: Touch 15 - restore actual 2D free panning and set new package identity
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_19.sh"
    - name: Touch 16 - bitmap cache (Dispose fix)
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_20.sh"
