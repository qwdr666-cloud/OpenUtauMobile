      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_36.sh"
    - name: Load voicebank text parts or uta.zip from workflow repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.sha }}
        path: .touch-assets
        persist-credentials: false
        sparse-checkout: '/uta.zip

          /uta.part*.txt

          /ROOT_FILES/uta.part*.txt'
        sparse-checkout-cone-mode: false
    - name: Restore bundled voicebank and verify every text part
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_38.sh"
    - name: Touch 33 - Crop mode, track navigation, native 60Hz cursor and default
