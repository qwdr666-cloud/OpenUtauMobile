      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_80.sh"
    - name: Touch36 R4 - shared cursor center and nonblocking panel dismissal
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_81.sh"
    - name: Load pinned host Worldline for bundled voice rendering
      uses: actions/checkout@v4
      with:
        repository: openutau/OpenUtau
        ref: 9b44e92145b1e35b49765db432246d256dccc30a
        path: .touch35-worldline
        sparse-checkout: 'runtimes/linux-x64/native/libworldline.so

          LICENSE.txt'
        sparse-checkout-cone-mode: false
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Bake all 132 default singer WAVs and test actual C# native renderer
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_61.sh"
    - name: Test singer preparation and installation regressions
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_62.sh"
    - name: Test real ZIP installer and DiffSinger ONNX keyboard inference
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_63.sh"
    - name: Compile Touch36 panel against MAUI controls (host API check)
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_76.sh"
    - name: Test R2 lyric controls API and touch state transitions on host
