    - name: Verify and extract cumulative build scripts
      shell: bash
      run: "python - <<'PY'\nfrom pathlib import Path\nimport json,base64,lzma,hashlib\n\
        p=Path('.touch36-r4-build');raw=lzma.decompress(base64.b64decode((p/'scripts.b64').read_bytes()))\n\
        assert hashlib.sha256(raw).hexdigest()=='09b9d835746f64982dc36dae6ef4a4363a975cc214c69d0ff5b55e65ac3e4e79'\n\
        for k,v in json.loads(raw).items():\n assert k.isdigit()\n (p/('step_'+k+'.sh')).write_text(v,encoding='utf-8')\n\
        PY\n"
    - name: Apply Touch source changes
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_1.sh"
    - name: Isolate OpenUtau Touch documents provider
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch36-r4-build/step_2.sh"
    - name: Upgrade to Touch 2 gestures and independent app identity
