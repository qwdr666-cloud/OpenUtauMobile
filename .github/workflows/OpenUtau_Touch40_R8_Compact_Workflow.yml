    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Pin installed .NET 9 SDK before all tests and workload commands
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/pin-dotnet9.sh"
    - name: Apply Touch source changes
      run: bash -e "$GITHUB_WORKSPACE/.touch40-compact/step_1.sh"
    - name: Isolate OpenUtau Touch documents provider
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_2.sh"
    - name: Upgrade to Touch 2 gestures and independent app identity
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_3.sh"
    - name: Add kinetic scrolling, independent draggable piano-roll playhead
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_4.sh"
    - name: Fix Touch 3 SkiaSharp touch action namespace
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_5.sh"
    - name: Add playhead follow toggle, black playhead, marquee without button
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_6.sh"
    - name: Touch 5 transparent toolbars, compact piano keys and grey playhead
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_7.sh"
