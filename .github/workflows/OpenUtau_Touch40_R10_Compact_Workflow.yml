    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Pin installed .NET 9 SDK before all tests and workload commands
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/pin-dotnet9.sh"
    - name: Apply Touch source changes
      run: bash -e "$GITHUB_WORKSPACE/.touch40-compact/step_1.sh"
    - name: Isolate OpenUtau Touch documents provider
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_2.sh"
    - name: Upgrade to Touch 2 gestures and independent app identity
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_3.sh"
    - name: Add kinetic scrolling, independent draggable piano-roll playhead
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_4.sh"
    - name: Fix Touch 3 SkiaSharp touch action namespace
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_5.sh"
    - name: Add playhead follow toggle, black playhead, marquee without button
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_6.sh"
    - name: Touch 5 transparent toolbars, compact piano keys and grey playhead
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_7.sh"
    - name: Touch 6 - restore original handles, repair expression panel, improve labels
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_8.sh"
    - name: Touch 7 - centered keys, smaller cursor grip, undoable line drawing
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_9.sh"
    - name: Validate Touch 7 line gesture event properties
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_10.sh"
    - name: Touch 8 - aim for 120Hz cursor, responsive piano scroll and inertia
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_11.sh"
    - name: Touch 9 - instrument actual input, redraw, canvas paint and UI timer callbacks
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_12.sh"
    - name: Touch 10 - Choreographer VSYNC diagnostic and opt-in frame drive
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_13.sh"
    - name: Touch 11 - de-jitter VSYNC and selectable 60/120Hz frame pacing
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_14.sh"
    - name: Touch 12 - heavy project rendering (assert correction)
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_15.sh"
    - name: Touch 13 - coalesce vertical viewport redraw with VSYNC
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_16.sh"
    - name: Touch 13 - intelligent axis lock for imprecise diagonal swipes
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_17.sh"
    - name: Touch 14 - temporary horizontal-only and vertical-only buttons
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_18.sh"
    - name: Touch 15 - restore actual 2D free panning and set new package identity
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_19.sh"
    - name: Touch 16 - bitmap cache (Dispose fix)
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_20.sh"
    - name: Touch 17 - hybrid X frame and Y touch with 2D LRU 300-tile cache
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_21.sh"
    - name: Touch 18 - independent X frame and Y touch/timer with diagonal support
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_22.sh"
    - name: Touch 19 - remove scroll staircase deadzone, preserve independent axes
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_23.sh"
    - name: Touch 20 - fix interrupted pan events and asynchronous diagonal repaint
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_24.sh"
    - name: Touch 21 - unified X/Y VSYNC with vertical redraw cost reduction
      run: bash -e "$GITHUB_WORKSPACE/.touch40-compact/step_25.sh"
    - name: Touch 22 - one X/Y coordinate commit per frame and indexed note cache
      run: bash -e "$GITHUB_WORKSPACE/.touch40-compact/step_26.sh"
    - name: Touch 23 - sparse pitch-time tiles and note hit-test index
      run: bash -e "$GITHUB_WORKSPACE/.touch40-compact/step_27.sh"
    - name: Touch 24 - reduce dispatch and profile all editor layers
      run: bash -e "$GITHUB_WORKSPACE/.touch40-compact/step_28.sh"
    - name: Touch 25 - optional diagnostics in rendering settings
      run: bash -e "$GITHUB_WORKSPACE/.touch40-compact/step_29.sh"
    - name: Touch 26 - remove out-of-part background shading
      run: bash -e "$GITHUB_WORKSPACE/.touch40-compact/step_30.sh"
    - name: Touch 27 - defer time grid during drag and inertia
      run: bash -e "$GITHUB_WORKSPACE/.touch40-compact/step_31.sh"
    - name: Touch 28 - Independent frame drive settings
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_32.sh"
    - name: Touch 29 - Unified piano roll and independent note cache
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_33.sh"
    - name: Touch 30 - Expression lines, smooth splitter, track inertia and 60Hz cursor
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_34.sh"
