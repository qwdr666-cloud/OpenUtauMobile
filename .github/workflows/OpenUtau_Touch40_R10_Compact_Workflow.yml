      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_40.sh"
    - name: Touch33 improvement 2 - exact expression line and frame-coalesced divider
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_41.sh"
    - name: Touch 34 - keyboard sound, independent avatar thumbnails and UI-thread lists
