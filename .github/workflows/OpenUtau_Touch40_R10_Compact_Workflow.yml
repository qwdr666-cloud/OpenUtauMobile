      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_35.sh"
    - name: Touch 32 - Direct translated and clipped divider drag
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_36.sh"
    - name: Load voicebank text parts or uta.zip from workflow repository
