        '''
        root = Path(os.environ['GITHUB_WORKSPACE'])
        root.mkdir(exist_ok=True)
        def decode91(value):
            alphabet = ''.join(chr(i) for i in range(33,127) if chr(i) not in (chr(39),chr(36),chr(92)))
            digits = {ch: i for i, ch in enumerate(alphabet)}
            out = bytearray()
            accumulator = bits = 0
            chars = iter(value)
            for first in chars:
                second = next(chars, None)
                if second is None:
                    out.append((accumulator | digits[first] << bits) & 255)
                    break
                pair = digits[first] + 91 * digits[second]
                accumulator |= pair << bits
                bits += 13 if (pair & 8191) > 88 else 14
                while bits >= 8:
                    out.append(accumulator & 255)
                    accumulator >>= 8
                    bits -= 8
            return out

        bundle = json.loads(lzma.decompress(decode91(''.join(payload.split()))))
        for name, script in bundle['scripts'].items():
            for i, literal in enumerate(bundle['literals']):
                script = script.replace('__TOUCH_LITERAL_' + str(i) + '__', repr(literal.encode('utf-8')))
            (root / name).parent.mkdir(parents=True,exist_ok=True)
            (root / name).write_text(script, encoding='utf-8')
        UNPACK40
