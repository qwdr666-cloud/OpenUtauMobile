      shell: bash
      timeout-minutes: 6
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_44.sh"
    - name: Verify piano sources and bake keyboard PCM assets
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_45.sh"
    - name: Touch 34 R1 - preloaded keyboard audio and press-fade feedback
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_46.sh"
    - name: Touch 34 R2 - prepare both keyboard timbres before home and disable silent feedback
