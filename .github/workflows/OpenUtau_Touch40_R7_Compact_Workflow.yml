      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_38.sh"
    - name: Touch 33 - Crop mode, track navigation, native 60Hz cursor and default singer
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_39.sh"
    - name: Touch 33 correction - idle divider snapshots and portable default singer
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_40.sh"
    - name: Touch33 improvement 2 - exact expression line and frame-coalesced divider
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_41.sh"
    - name: Touch 34 - keyboard sound, independent avatar thumbnails and UI-thread lists
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/.touch40-compact/step_42.sh"
    - name: Load pinned Salamander piano samples
      uses: actions/checkout@v4
      with:
        repository: Tonejs/audio
        ref: efd8296360f9526e379bfbe5c1698ff54d6a1d34
        path: .touch-piano-assets
        persist-credentials: false
        sparse-checkout: |-
          /salamander/C1.mp3
          /salamander/C2.mp3
