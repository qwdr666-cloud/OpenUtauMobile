        change(edit,\n       '''            _touch10FingerDown = true;\n            _touch10LastTouchStamp = System.Diagnostics.Stopwatch.GetTimestamp();\n\
        \            Touch10StartFrameLoop();''',\n       '''            _touch10FingerDown = true;\n          \
        \  _touch11Dirty = true;\n            _touch10LastTouchStamp = System.Diagnostics.Stopwatch.GetTimestamp();\n\
        \            Touch10StartFrameLoop();''',\n       'Only mark drawing dirty on new touch updates')\n\n# A\
        \ frame callback is always scheduled on the Android main Looper. It is *not*\n# evidence of a presented\
