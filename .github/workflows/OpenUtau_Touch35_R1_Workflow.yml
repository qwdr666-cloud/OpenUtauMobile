    - name: Install MAUI Android workload
      run: dotnet workload install maui-android
    - name: Build signed standalone ARM64 APK
      run: dotnet publish OpenUtauMobile/OpenUtauMobile.csproj -f net9.0-android -c Release -p:TargetFrameworks=net9.0-android
        -p:RuntimeIdentifier=android-arm64 -p:RuntimeIdentifiers=android-arm64 -p:AndroidCreatePackagePerAbi=false
        -p:AndroidPackageFormats=apk -p:AndroidKeyStore=false -p:RunAOTCompilation=true -p:AndroidEnableProfiledAot=true
        -p:EmbedAssembliesIntoApk=true -bl:touch-build.binlog
    - name: Verify package and signature
      shell: bash
      run: "set -euo pipefail\nAPK=$(find OpenUtauMobile/bin/Release -name '*-Signed.apk' -print -quit)\nif [[ -z\
        \ \"$APK\" ]]; then\n  echo '::error::Signed APK not found in Release output'\n  exit 1\nfi\nBUILD_TOOLS=$(find\
        \ \"$ANDROID_HOME/build-tools\" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)\n\"$BUILD_TOOLS/apksigner\"\
        \ verify --verbose --print-certs \"$APK\" | tee signature.txt\n\"$BUILD_TOOLS/aapt\" dump badging \"$APK\"\
        \ | tee package.txt\n\"$BUILD_TOOLS/aapt\" dump xmltree \"$APK\" AndroidManifest.xml > manifest-tree.txt\n\
        \n# Verify Touch 20 independently of Touch 16 and the official package. The previous Touch 1 authority check\n\
        # was mistakenly left in the old workflow and caused exit code 1.\ngrep -Fq \"package: name='pers.vocoder712.openutaumobile.touchmarquee.v35.r1'\"\
        \ package.txt || {\n  echo '::error::Touch 33 package name mismatch'; exit 1;\n}\ngrep -Fq \"application-label:'OpenUtau\
        \ Touch35 改进1'\" package.txt || {\n  echo '::error::Touch 33 application label mismatch'; exit 1;\n}\ngrep\
        \ -Eq \"native-code:.*'arm64-v8a'\" package.txt || {\n  echo '::error::Expected ARM64 native libraries not\
        \ found'; exit 1;\n}\ngrep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v35.r1.documents' manifest-tree.txt\
        \ || {\n  echo '::error::Touch 33 DocumentsProvider authority not found'; exit 1;\n}\nif grep -Fq 'pers.vocoder712.openutaumobile.documents'\
        \ manifest-tree.txt || \\\n   grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.documents' manifest-tree.txt\
        \ || \\\n   grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v2.documents' manifest-tree.txt || \\\n\
        \   grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v3.documents' manifest-tree.txt || \\\n   grep\
        \ -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v4.documents' manifest-tree.txt || \\\n   grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v5.documents'\
        \ manifest-tree.txt || \\\n   grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v6.documents' manifest-tree.txt\
        \ || \\\n   grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v7.documents' manifest-tree.txt || \\\n\
        \   grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v8.documents' manifest-tree.txt || \\\n    grep\
        \ -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v9.documents' manifest-tree.txt || \\\n    grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v10.documents'\
        \ manifest-tree.txt || \\\n    grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v11.documents' manifest-tree.txt\
        \ || \\\n    grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v12.documents' manifest-tree.txt || \\\
        \n    grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v13.documents' manifest-tree.txt || \\\n   \
        \ grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v14.documents' manifest-tree.txt || \\\n    grep\
        \ -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v15.documents' manifest-tree.txt || \\\n    grep -Fq\
        \ 'pers.vocoder712.openutaumobile.touchmarquee.v16.documents' manifest-tree.txt || \\\n              grep\
        \ -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v17.documents' manifest-tree.txt || \\\n            \
        \  grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v18.documents' manifest-tree.txt || \\\n      \
        \                grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v19.documents' manifest-tree.txt\
        \ || \\\n                      grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v20.documents' manifest-tree.txt\
        \ || \\\n                      grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v21.documents' manifest-tree.txt\
        \ || \\\n                      grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v22.documents' manifest-tree.txt;\
        \ then\n  echo '::error::An original or older Touch DocumentsProvider authority remains'\n  exit 1\nfi\n\
        echo 'Checking packaged AOT outputs (informational):'\nunzip -Z1 \"$APK\" | grep -E 'libaot|aot-data' |\
        \ head -n 12 || true\necho 'All APK identity and coexistence checks passed.' \nmkdir -p artifacts\ncp \"\
        $APK\" artifacts/OpenUtau-Touch-35-R1-ARM64.apk\ncp signature.txt package.txt manifest-tree.txt artifacts/\n\
        sha256sum artifacts/*.apk > artifacts/SHA256SUMS\n\npython - \"$APK\" <<'PYBANKVERIFY'\nimport sys,zipfile,hashlib,io\n\
        with zipfile.ZipFile(sys.argv[1]) as apk:\n    names=[n for n in apk.namelist() if n.endswith(\"assets/touch-default-uta.zip\"\
        )]\n    assert len(names)==1, \"Bundled default bank missing from APK\"\n    bank=apk.read(names[0])\n \
        \   assert hashlib.sha256(bank).hexdigest()=='cb50ef6e9909d64547ccc2816db309e7eedbb7c218d6ec4d1359dbfd4610a88e'\n\
        \    with zipfile.ZipFile(io.BytesIO(bank)) as z:\n        assert z.testzip() is None\n        assert \"\
        uta/character.txt\" in z.namelist() and \"uta/oto.ini\" in z.namelist()\n        assert sum(n.lower().endswith(\"\
        .wav\") for n in z.namelist())==142\nprint(\"PASS bundled default singer: original archive verified, 142\
        \ WAV files\")\nPYBANKVERIFY\n\npython - \"$APK\" <<'PYPIANOVERIFY'\nfrom pathlib import Path\nimport sys,zipfile,json,hashlib\n\
        manifest=Path('manifest-tree.txt').read_text()\nassert 'pers.vocoder712.openutaumobile.touchmarquee.v34.r4.documents'\
        \ not in manifest\nassert 'pers.vocoder712.openutaumobile.touchmarquee.v34.r3.documents' not in manifest\n\
        assert 'pers.vocoder712.openutaumobile.touchmarquee.v34.r2.documents' not in manifest\nassert 'pers.vocoder712.openutaumobile.touchmarquee.v34.r1.documents'\
        \ not in manifest\nassert 'pers.vocoder712.openutaumobile.touchmarquee.v34.documents' not in manifest\n\
        assert 'pers.vocoder712.openutaumobile.touchmarquee.v33.documents' not in manifest\nassert 'pers.vocoder712.openutaumobile.touchmarquee.v33.r2.documents'\
        \ not in manifest\nwith zipfile.ZipFile(sys.argv[1]) as apk:\n    def read_asset(name):\n        entries=[n\
        \ for n in apk.namelist() if n.endswith('assets/'+name)]\n        assert len(entries)==1, ('Missing or duplicated\
        \ asset',name)\n        return apk.read(entries[0])\n    import io,wave\n    assets=json.loads(read_asset('touch34-keyboard-v1.json'))\n\
        \    piano_hashes=json.loads(read_asset('touch34-piano-sha256.json'))\n    assert set(assets)=={f'touch34-keyboard-{mode}-{midi}.wav'\
        \ for mode in (1,2) for midi in range(132)}\n    assert not any(n.endswith('.pcm') and 'touch34-piano-'\
        \ in n for n in apk.namelist())\n    for name,expected in assets.items():\n        data=read_asset(name)\n\
        \        assert len(data)==expected['length'] and hashlib.sha256(data).hexdigest()==expected['sha256'],name\n\
        \        mode,midi=map(int,name.removesuffix('.wav').split('-')[-2:])\n        with wave.open(io.BytesIO(data))\
        \ as f:\n            assert (f.getnchannels(),f.getsampwidth(),f.getframerate())==(1,2,44100),name\n   \
        \         assert f.getnframes()==(24255 if mode==1 else 30870),name\n            pcm=f.readframes(f.getnframes())\n\
        \        if mode==2:assert hashlib.sha256(pcm).hexdigest()==piano_hashes[f'touch34-piano-{midi}.pcm'],name\n\
        \    credits=read_asset('touch34-piano-credits.txt').decode('utf-8')\n    assert 'Alexander Holm' in credits\
        \ and 'CC BY 3.0' in credits\nprint('PASS keyboard piano assets: all 264 baked WAV notes and attribution\
        \ are packaged and verified')\nPYPIANOVERIFY\n"
    - name: Verify 132 rendered singer WAVs inside APK
      shell: bash
      run: "python - <<'PYVERIFY35R1'\nimport json,hashlib,zipfile,glob\nfrom pathlib import Path\napk=glob.glob('OpenUtauMobile/bin/Release/**/*-Signed.apk',recursive=True)\n\
        assert apk\nraw=Path('OpenUtauMobile/Resources/Raw')\nmanifest=json.loads((raw/'touch35r1-uta-manifest.json').read_text())\n\
        assert len(manifest)==132\nwith zipfile.ZipFile(apk[0]) as z:\n assert not any('/touch35-uta-' in n for\
        \ n in z.namelist())\n for name,h in manifest.items():\n  matches=[n for n in z.namelist() if n.endswith('/'+name)]\n\
        \  assert len(matches)==1,(name,matches)\n  assert hashlib.sha256(z.read(matches[0])).hexdigest()==h,name\n\
        PYVERIFY35R1\n"
    - uses: actions/upload-artifact@v4
      with:
        name: OpenUTAU-Touch-35-R1-ARM64
        path: artifacts/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: OpenUTAU-Touch-35-R1-BuildLogs
        path: touch-build.binlog
'on':
  workflow_dispatch: null
