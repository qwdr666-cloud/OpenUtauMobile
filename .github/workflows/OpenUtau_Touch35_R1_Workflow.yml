        \    PlaybackTimer.Start();\n#if ANDROID\n        _touch10LastTouchStamp = System.Diagnostics.Stopwatch.GetTimestamp();\n\
        \        Touch10StartFrameLoop();\n#endif\n    }''',\n       'Make OFF / stable60 / high120 selectable without\
