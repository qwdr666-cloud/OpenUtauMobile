name: OpenUtau Touch 35 R1 - rendered singer keyboard audio
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        repository: qwdr666-cloud/OpenUtauMobile
        ref: 17a86f602e054c345841684224903004eff1f536
        persist-credentials: false
    - name: Apply Touch source changes
      run: 'python - <<''PYTHON''

        import base64, zlib

        from pathlib import Path

        Path(''/tmp/touch.patch'').write_bytes(zlib.decompress(base64.b64decode('''')))

        PYTHON

        git apply --check /tmp/touch.patch

        git apply /tmp/touch.patch

        '
    - name: Isolate OpenUtau Touch documents provider
      shell: bash
      run: "python - <<'PYPROVIDER'\nfrom pathlib import Path\npath = Path('OpenUtauMobile/Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs')\n\
        text = path.read_text(encoding='utf-8-sig')\nold = '[\"pers.vocoder712.openutaumobile.documents\"]'\nnew\
        \ = '[\"pers.vocoder712.openutaumobile.touchmarquee.documents\"]'\nif text.count(old) != 1:\n    raise SystemExit('Expected\
        \ exactly one original DocumentsProvider authority')\ntext = text.replace(old, new)\ntext = text.replace('ColumnTitle,\
        \ \"OpenUtau Mobile\"', 'ColumnTitle, \"OpenUtau Touch\"')\npath.write_text(text, encoding='utf-8')\nprint('Isolated\
        \ DocumentsProvider authority:', new)\nPYPROVIDER\n"
    - name: Upgrade to Touch 2 gestures and independent app identity
      shell: bash
      run: 'set -euo pipefail

        python - <<''PYUPGRADE''

        import base64, zlib

        from pathlib import Path

        Path(''/tmp/touch2.patch'').write_bytes(zlib.decompress(base64.b64decode('''')))

        PYUPGRADE

        git apply --check /tmp/touch2.patch

        git apply /tmp/touch2.patch

        python - <<''PYFINAL''

        from pathlib import Path


        # GitHub-hosted builds use temporary signing keys. Use a new package ID so

        # Touch 2 installs beside the existing Touch 1 and official OpenUtau Mobile.

        csproj = Path(''OpenUtauMobile/OpenUtauMobile.csproj'')

        c = csproj.read_text(encoding=''utf-8-sig'')

        old = ''<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee</ApplicationId>''

        assert c.count(old) == 1, ''Touch 1 package ID not found''

        c = c.replace(old, ''<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v2</ApplicationId>'')

        assert c.count(''<ApplicationTitle>OpenUtau Touch</ApplicationTitle>'') == 1

        c = c.replace(''<ApplicationTitle>OpenUtau Touch</ApplicationTitle>'', ''<ApplicationTitle>OpenUtau Touch
        2</ApplicationTitle>'')

        assert c.count(''<ApplicationDisplayVersion>1.1.7</ApplicationDisplayVersion>'') == 1

        c = c.replace(''<ApplicationDisplayVersion>1.1.7</ApplicationDisplayVersion>'', ''<ApplicationDisplayVersion>1.1.8</ApplicationDisplayVersion>'')

        assert c.count(''<ApplicationVersion>16</ApplicationVersion>'') == 1

        c = c.replace(''<ApplicationVersion>16</ApplicationVersion>'', ''<ApplicationVersion>17</ApplicationVersion>'')

        csproj.write_text(c, encoding=''utf-8'')


        manifest = Path(''OpenUtauMobile/Platforms/Android/AndroidManifest.xml'')

        m = manifest.read_text(encoding=''utf-8-sig'')

        assert m.count(''android:label="OpenUtau Touch"'') == 1

        manifest.write_text(m.replace(''android:label="OpenUtau Touch"'', ''android:label="OpenUtau Touch 2"''),
        encoding=''utf-8'')


        provider = Path(''OpenUtauMobile/Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs'')

        p = provider.read_text(encoding=''utf-8-sig'')

        old_authority = ''pers.vocoder712.openutaumobile.touchmarquee.documents''

        assert p.count(old_authority) == 1, ''Touch 1 provider authority not found''

        p = p.replace(old_authority, ''pers.vocoder712.openutaumobile.touchmarquee.v2.documents'')

        p = p.replace(''ColumnTitle, "OpenUtau Touch"'', ''ColumnTitle, "OpenUtau Touch 2"'')

        provider.write_text(p, encoding=''utf-8'')


        # Brighten selected notes *after* painting the notes themselves.

        # The original border was drawn before the opaque note body, hiding it.

        draw = Path(''OpenUtauMobile/Views/DrawableObjects/DrawableNotes.cs'')

        d = draw.read_text(encoding=''utf-8-sig'')

        match = ''            foreach (UNote note in Part.notes)''

        assert d.count(match) >= 2, ''Note rendering loop not found''

        glows = ''            using SKPaint selectedLightFill = new()\n            {\n                Color = new
        SKColor(249, 254, 255, 112),\n                Style = SKPaintStyle.Fill,\n                IsAntialias =
        true,\n            };\n            using SKPaint selectedOuterGlow = new()\n            {\n                Color
        = new SKColor(91, 222, 255, 143),\n                Style = SKPaintStyle.Stroke,\n                StrokeWidth
        = 8f * (float)ViewModel.Density,\n                IsAntialias = true,\n            };\n            using
        SKPaint selectedBrightOutline = new()\n            {\n                Color = new SKColor(249, 253, 255,
        255),\n                Style = SKPaintStyle.Stroke,\n                StrokeWidth = 2.5f * (float)ViewModel.Density,\n                IsAntialias
        = true,\n            };\n''

        d = d.replace(match, glows + match, 1)

        fill_marker = ''HeightPerPianoKey * ViewModel.PianoRollTransformer.ZoomY, paint);''

        assert d.count(fill_marker) == 1, ''Note body drawing call not found''

        enhanced = ''\n                // Draw selected-note light last so the opaque body cannot cover it.\n                if
        (ViewModel.SelectedNotes.Contains(note))\n                {\n                    float x = (PositionX +
        note.position) * ViewModel.PianoRollTransformer.ZoomX + ViewModel.PianoRollTransformer.PanX;\n                    float
        y = (ViewConstants.TotalPianoKeys - note.tone - 1) * HeightPerPianoKey * ViewModel.PianoRollTransformer.ZoomY
        + ViewModel.PianoRollTransformer.PanY;\n                    float w = note.duration * ViewModel.PianoRollTransformer.ZoomX;\n                    float
        h = HeightPerPianoKey * ViewModel.PianoRollTransformer.ZoomY;\n                    Canvas.DrawRect(x, y,
        w, h, selectedLightFill);\n                    Canvas.DrawRect(x, y, w, h, selectedOuterGlow);\n                    Canvas.DrawRect(x,
        y, w, h, selectedBrightOutline);\n                }\n''

        d = d.replace(fill_marker, fill_marker + enhanced, 1)

        draw.write_text(d, encoding=''utf-8'')

        print(''Touch 2: long-press marquee, edge scroll, selected-note glow, standalone identity'')

        PYFINAL

        '
    - name: Add kinetic scrolling, independent draggable piano-roll playhead
      shell: bash
      run: "set -euo pipefail\npython - <<'PYFEATURE'\nimport base64,zlib\nfrom pathlib import Path\nPath('/tmp/touch3-feature.patch').write_bytes(zlib.decompress(base64.b64decode('')))\n\
        PYFEATURE\ngit apply --check /tmp/touch3-feature.patch\ngit apply /tmp/touch3-feature.patch\npython - <<'PYIDENTITY'\n\
        from pathlib import Path\ndef swap_one(path, old, new):\n    file = Path(path)\n    content = file.read_text(encoding='utf-8-sig')\n\
        \    if content.count(old) != 1:\n        raise RuntimeError(f'{file}: expected one match for {old!r}, got\
        \ {content.count(old)}')\n    file.write_text(content.replace(old,new),encoding='utf-8')\n\n# New package\
        \ & DocumentsProvider authority: avoid collisions and\n# signature-update errors with the official, Touch\
        \ 1 and Touch 2 apps.\ncsproj='OpenUtauMobile/OpenUtauMobile.csproj'\nswap_one(csproj,'<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v2</ApplicationId>',\n\
        \           '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v3</ApplicationId>')\nswap_one(csproj,'<ApplicationTitle>OpenUtau\
        \ Touch 2</ApplicationTitle>',\n           '<ApplicationTitle>OpenUtau Touch 3</ApplicationTitle>')\nswap_one(csproj,'<ApplicationDisplayVersion>1.1.8</ApplicationDisplayVersion>',\n\
        \           '<ApplicationDisplayVersion>1.1.9</ApplicationDisplayVersion>')\nswap_one(csproj,'<ApplicationVersion>17</ApplicationVersion>',\n\
        \           '<ApplicationVersion>18</ApplicationVersion>')\nswap_one('OpenUtauMobile/Platforms/Android/AndroidManifest.xml',\n\
        \           'android:label=\"OpenUtau Touch 2\"','android:label=\"OpenUtau Touch 3\"')\nprovider='OpenUtauMobile/Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs'\n\
        swap_one(provider, 'pers.vocoder712.openutaumobile.touchmarquee.v2.documents',\n           'pers.vocoder712.openutaumobile.touchmarquee.v3.documents')\n\
        swap_one(provider, 'ColumnTitle, \"OpenUtau Touch 2\"', 'ColumnTitle, \"OpenUtau Touch 3\"')\n\n# Overlay\
        \ remains transparent to touch, so the existing note gesture\n# handler receives taps and can perform playhead\
        \ hit-testing.\nxaml='OpenUtauMobile/Views/EditPage.xaml'\nmatch='<skia:SKCanvasView x:Name=\"PianoRollPitchCanvas\"\
        \ Grid.Column=\"1\" PaintSurface=\"PianoRollPitchCanvas_PaintSurface\"/>'\nextra='<skia:SKCanvasView x:Name=\"\
        PianoRollPlayheadCanvas\" Grid.Column=\"1\" InputTransparent=\"True\" PaintSurface=\"PianoRollPlayheadCanvas_PaintSurface\"\
        />'\nswap_one(xaml, match, match+'\\n                         '+extra)\n# Old implementation paints a permanent\
        \ cursor line at a fixed X.\n# Remove it: the new overlay paints the cursor at actual play time.\ndraw='OpenUtauMobile/Views/DrawableObjects/DrawablePianoRollTickBackground.cs'\n\
        swap_one(draw, 'float posX = (float)DeviceDisplay.Current.MainDisplayInfo.Density * ViewConstants.PianoRollPlaybackLinePos;\\\
        n            Canvas.DrawLine(new SKPoint(posX, 0), new SKPoint(posX, bottom + 0.5f), ThemeColorsManager.Current.PianoRollPlaybackPosLinePaint);',\n\
        \               '// Cursor is drawn on PianoRollPlayheadCanvas at PlayPosTick.')\nprint('Touch 3: kinetic\
        \ scrolling, movable seek line, standalone application identity')\nPYIDENTITY\n"
    - name: Fix Touch 3 SkiaSharp touch action namespace
      shell: bash
      run: "python - <<'PYFIX'\nfrom pathlib import Path\nfile = Path('OpenUtauMobile/Views/EditPage.xaml.cs')\n\
        source = file.read_text(encoding='utf-8-sig')\nrequired = 'using SkiaSharp.Views.Maui;'\nif required not\
        \ in source:\n    anchor = 'using SkiaSharp;'\n    if source.count(anchor) != 1:\n        raise SystemExit('Could\
        \ not locate SkiaSharp import in EditPage.xaml.cs')\n    source = source.replace(anchor, anchor + '\\n'\
        \ + required, 1)\n    file.write_text(source, encoding='utf-8')\nassert 'using SkiaSharp.Views.Maui;' in\
        \ source\nassert source.count('SKTouchAction.') >= 9\nprint('Added SkiaSharp.Views.Maui namespace used by\
        \ SKTouchAction enum')\nPYFIX\n"
    - name: Add playhead follow toggle, black playhead, marquee without button
      shell: bash
      run: "set -euo pipefail\npython - <<'PYTOUCH4'\nfrom pathlib import Path\n\nROOT=Path('OpenUtauMobile')\n\n\
        def swap_one(file, old, new):\n    path=ROOT/file\n    s=path.read_text(encoding='utf-8-sig')\n    count=s.count(old)\n\
        \    if count!=1:\n        raise RuntimeError(f'{path}: expected exactly one occurrence, got {count}, for\
        \ {old[:160]!r}')\n    path.write_text(s.replace(old,new),encoding='utf-8')\n\ndef change(file, action):\n\
        \    path=ROOT/file\n    source=path.read_text(encoding='utf-8-sig')\n    output=action(source)\n    if\
        \ output==source: raise RuntimeError(f'No change applied to {path}')\n    path.write_text(output,encoding='utf-8')\n\
        \n# Add separately installable Touch 4 identity.\nswap_one('OpenUtauMobile.csproj',\n         '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v3</ApplicationId>',\n\
        \         '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v4</ApplicationId>')\nswap_one('OpenUtauMobile.csproj','<ApplicationTitle>OpenUtau\
        \ Touch 3</ApplicationTitle>',\n         '<ApplicationTitle>OpenUtau Touch 4</ApplicationTitle>')\nswap_one('OpenUtauMobile.csproj','<ApplicationDisplayVersion>1.1.9</ApplicationDisplayVersion>',\n\
        \         '<ApplicationDisplayVersion>1.1.10</ApplicationDisplayVersion>')\nswap_one('OpenUtauMobile.csproj','<ApplicationVersion>18</ApplicationVersion>',\n\
        \         '<ApplicationVersion>19</ApplicationVersion>')\nswap_one('Platforms/Android/AndroidManifest.xml','android:label=\"\
        OpenUtau Touch 3\"',\n         'android:label=\"OpenUtau Touch 4\"')\nswap_one('Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs',\n\
        \         'pers.vocoder712.openutaumobile.touchmarquee.v3.documents',\n         'pers.vocoder712.openutaumobile.touchmarquee.v4.documents')\n\
        swap_one('Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs',\n         'ColumnTitle, \"OpenUtau\
        \ Touch 3\"', 'ColumnTitle, \"OpenUtau Touch 4\"')\n\n# Replace the central pitch-anchor button in the four-button\
        \ note editing toolbar.\n# It remains a Button with the exact original styling and dimensions.\nswap_one('Views/EditPage.xaml',\n\
        \         '<Button ImageSource=\"{DynamicResource anchor}\" WidthRequest=\"25\" Grid.Column=\"3\" x:Name=\"\
        ButtonSwitchEditPitchAnchorMode\" Style=\"{StaticResource NoteEditModeButtonStyle}\" Clicked=\"ButtonSwitchNoteMode_Clicked\"\
        \ Padding=\"12\"/>',\n         '<Button ImageSource=\"followplayhead.png\" WidthRequest=\"25\" Grid.Column=\"\
        3\" x:Name=\"ButtonFollowPlayhead\" Style=\"{StaticResource NoteEditModeButtonStyle}\" Clicked=\"ButtonFollowPlayhead_Clicked\"\
        \ Padding=\"12\" SemanticProperties.Description=\"播放时跟随指针（点击开关）\" />')\n\n# .NET MAUI processes the SVG\
        \ icon into PNG at build time using MauiImage.\nicon=ROOT/'Resources/Images/followplayhead.svg'\nicon.parent.mkdir(parents=True,exist_ok=True)\n\
        icon.write_text('''<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24\
        \ 24\">\n  <g fill=\"none\" stroke=\"#181818\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"\
        round\">\n    <path d=\"M12 3V21\"/>\n    <path d=\"M3 8V16M21 8V16\"/>\n    <path d=\"M5.5 12H9.5M14.5\
        \ 12H18.5\"/>\n    <path d=\"m7.5 10 2 2-2 2M16.5 10l-2 2 2 2\"/>\n  </g>\n</svg>''',encoding='utf-8')\n\
        \n# Follow is a standalone toggle, not a pitch-edit mode. Keep default on to\n# preserve Touch 3's behavior\
        \ until the user presses the button.\nswap_one('Views/EditPage.xaml.cs',\n         '    private bool _pianoPlayheadDragging;',\n\
        \         '    private bool _followPianoPlayhead = true;\\n    private bool _pianoPlayheadDragging;')\n\
        swap_one('Views/EditPage.xaml.cs',\n         'ButtonSwitchEditPitchAnchorMode.BackgroundColor = mode ==\
        \ EditViewModel.NoteEditMode.EditPitchAnchor ? activeColor : Colors.Transparent;',\n         'ButtonFollowPlayhead.BackgroundColor\
        \ = _followPianoPlayhead ? activeColor : Colors.Transparent;')\nswap_one('Views/EditPage.xaml.cs',\n   \
        \      'if (_viewModel.Playing && !_pianoPlayheadDragging)',\n         'if (_followPianoPlayhead && _viewModel.Playing\
        \ && !_pianoPlayheadDragging)')\n\n# Replace old pitch anchor handler branch and add a function to update\
        \ active style.\nswap_one('Views/EditPage.xaml.cs',\n         '''        else if (sender == ButtonSwitchEditPitchAnchorMode)\n\
        \        {\n            _viewModel.CurrentNoteEditMode = EditViewModel.NoteEditMode.EditPitchAnchor;\n \
        \       }\n''', '')\nswap_one('Views/EditPage.xaml.cs',\n         '    private void ButtonSwitchNoteMode_Clicked(object\
        \ sender, EventArgs e)',\n         '''    private void ButtonFollowPlayhead_Clicked(object sender, EventArgs\
        \ e)\n    {\n        _followPianoPlayhead = !_followPianoPlayhead;\n        SKColorMauiColorConverter converter\
        \ = new();\n        Color? activeColor = converter.Convert(\n            ThemeColorsManager.Current.ActiveNoteEditModeButton,\n\
        \            typeof(Color), null, null!) as Color;\n        ButtonFollowPlayhead.BackgroundColor = _followPianoPlayhead\n\
        \            ? activeColor : Colors.Transparent;\n        // The current play position and scroll state\
        \ remain untouched.\n        // On the next playback tick, enabled follow resumes automatically.\n    }\n\
        \n    private void ButtonSwitchNoteMode_Clicked(object sender, EventArgs e)''')\n\n# Playhead: fully black\
        \ line with a small vertical rectangle at top.\n# Using rect (not a triangle) also increases the visible\
        \ grab-target clarity.\nswap_one('Views/EditPage.xaml.cs',\n         'Color = new SKColor(179, 243, 83,\
        \ 195), StrokeWidth = 2f * density,',\n         'Color = SKColors.Black, StrokeWidth = 2f * density,')\n\
        swap_one('Views/EditPage.xaml.cs',\n         'Color = new SKColor(179, 243, 83, 255),',\n         'Color\
        \ = SKColors.Black,')\nswap_one('Views/EditPage.xaml.cs',\n         '''        using var shape = new SKPath();\n\
        \        shape.MoveTo(x - 11 * density, 0);\n        shape.LineTo(x + 11 * density, 0);\n        shape.LineTo(x,\
        \ 17 * density);\n        shape.Close();\n        canvas.DrawPath(shape, handle);''',\n         '''    \
        \    // Small upright rectangular grip; keep the cursor centered.\n        canvas.DrawRoundRect(new SKRect(x\
        \ - 5f * density, 0,\n            x + 5f * density, 18f * density), 1.5f * density,\n            1.5f *\
        \ density, handle);''')\n\n# Long-press empty piano roll for 500ms then move = marquee in BOTH single\n\
        # and multi selection modes. Ordinary swipes and note drags stay unchanged.\nswap_one('Views/EditPage.xaml.cs',\n\
        \         '''            _viewModel.CurrentSelectMode == EditViewModel.SelectionMode.Multi &&\n        \
        \    _viewModel.CurrentNoteEditMode == EditViewModel.NoteEditMode.EditNote &&''',\n         '''        \
        \    _viewModel.CurrentNoteEditMode == EditViewModel.NoteEditMode.EditNote &&''')\nswap_one('Views/EditPage.xaml.cs',\n\
        \         '''                    if (_viewModel.CurrentSelectMode == EditViewModel.SelectionMode.Multi &&\n\
        \                        _viewModel.EditingNotes != null && _viewModel.EditingPart != null)''',\n      \
        \   '''                    if (_viewModel.EditingNotes != null && _viewModel.EditingPart != null)''')\n\
        swap_one('Views/EditPage.xaml.cs',\n         '''        if (!_marqueeActive || _viewModel.CurrentSelectMode\
        \ != EditViewModel.SelectionMode.Multi)\n''',\n         '''        if (!_marqueeActive || _viewModel.CurrentNoteEditMode\
        \ != EditViewModel.NoteEditMode.EditNote)\n''')\n\n# Verify no obsolete toolbar button name remains.\ns=(ROOT/'Views/EditPage.xaml.cs').read_text(encoding='utf-8')\n\
        x=(ROOT/'Views/EditPage.xaml').read_text(encoding='utf-8')\nassert 'ButtonSwitchEditPitchAnchorMode' not\
        \ in (s+x)\nassert 'ButtonFollowPlayhead_Clicked' in s and 'ButtonFollowPlayhead' in x\nassert 'if (_followPianoPlayhead\
        \ && _viewModel.Playing' in s\nassert 'if (_viewModel.EditingNotes != null && _viewModel.EditingPart !=\
        \ null)' in s\nassert 'canvas.DrawRoundRect(new SKRect(x - 5f' in s\nassert icon.exists()\nprint('Touch\
        \ 4 customization applied and validated')\nPYTOUCH4\n"
    - name: Touch 5 transparent toolbars, compact piano keys and grey playhead
      shell: bash
      run: "set -euo pipefail\npython - <<'PYTOUCH5'\nfrom pathlib import Path\nimport re\n\nROOT = Path('OpenUtauMobile')\n\
        \ndef edit(relative, fn):\n    path = ROOT / relative\n    source = path.read_text(encoding='utf-8-sig')\n\
        \    output = fn(source)\n    if output == source:\n        raise RuntimeError(f'Nothing changed: {path}')\n\
        \    path.write_text(output, encoding='utf-8')\n\ndef once(source, old, new, desc):\n    n = source.count(old)\n\
        \    if n != 1:\n        raise RuntimeError(f'{desc}: wanted exactly one match, got {n}: {old[:110]!r}')\n\
        \    return source.replace(old, new, 1)\n\n# Touch 5 has its own Android identity so it can coexist with\
        \ Touch 1..4.\ndef identity(s):\n    for old,new in [\n        ('<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v4</ApplicationId>',\n\
        \         '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v5</ApplicationId>'),\n        ('<ApplicationTitle>OpenUtau\
        \ Touch 4</ApplicationTitle>',\n         '<ApplicationTitle>OpenUtau Touch 5</ApplicationTitle>'),\n   \
        \     ('<ApplicationDisplayVersion>1.1.10</ApplicationDisplayVersion>',\n         '<ApplicationDisplayVersion>1.1.11</ApplicationDisplayVersion>'),\n\
        \        ('<ApplicationVersion>19</ApplicationVersion>', '<ApplicationVersion>20</ApplicationVersion>'),\n\
        \    ]:\n        s=once(s,old,new,'Touch 5 identity')\n    return s\nedit('OpenUtauMobile.csproj',identity)\n\
        edit('Platforms/Android/AndroidManifest.xml',lambda s: once(s,'android:label=\"OpenUtau Touch 4\"','android:label=\"\
        OpenUtau Touch 5\"','manifest label'))\ndef provider(s):\n    s=once(s,'pers.vocoder712.openutaumobile.touchmarquee.v4.documents',\n\
        \        'pers.vocoder712.openutaumobile.touchmarquee.v5.documents','provider authority')\n    return once(s,'ColumnTitle,\
        \ \"OpenUtau Touch 4\"','ColumnTitle, \"OpenUtau Touch 5\"','provider title')\nedit('Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs',\
        \ provider)\n\n# One visual group per row: hide *both* floating tools and their backgrounds.\n# Parent opacity\
        \ applies to the pink background and black icons alike, and\n# parent IsVisible blocks touch events when\
        \ the overlay is hidden.\ndef xaml(s):\n    # Match by distinctive row definitions, rather than whitespace-sensitive\
        \ XML.\n    s,n = re.subn(\n        r'<Grid(?=\\s+AbsoluteLayout\\.LayoutBounds=\"1,0,AutoSize,AutoSize\"\
        )(?=[^>]*RowDefinitions=\"40,40,40\")',\n        '<Grid x:Name=\"Touch5TrackOverlay\" Opacity=\"0.56\"',\
        \ s, count=1)\n    if n != 1: raise RuntimeError('Track floating toolbar was not found')\n    s,n = re.subn(\n\
        \        r'<Grid(?=\\s+AbsoluteLayout\\.LayoutBounds=\"1,0,AutoSize,AutoSize\")(?=[^>]*RowDefinitions=\"\
        Auto, Auto\")',\n        '<Grid x:Name=\"Touch5PianoOverlay\" Opacity=\"0.56\"', s, count=1)\n    if n !=\
        \ 1: raise RuntimeError('Piano floating toolbar was not found')\n    s=once(s,\n        '<Button ImageSource=\"\
        {DynamicResource sine}\" WidthRequest=\"25\" Grid.Column=\"4\" x:Name=\"ButtonSwitchEditVibratoMode\" Style=\"\
        {StaticResource NoteEditModeButtonStyle}\" Clicked=\"ButtonSwitchNoteMode_Clicked\" Padding=\"12\" />',\n\
        \        '<Button ImageSource=\"touch5_eye_off.png\" WidthRequest=\"25\" Grid.Column=\"4\" x:Name=\"ButtonToggleFloatingTools\"\
        \ Style=\"{StaticResource NoteEditModeButtonStyle}\" Clicked=\"ButtonToggleFloatingTools_Clicked\" Padding=\"\
        12\" SemanticProperties.Description=\"隐藏或显示右侧悬浮工具按钮\" />',\n        'fourth toolbar button')\n    # Maintain\
        \ alignment of the piano keyboard, pitch expression strip and drag handles.\n    for old,new,desc in [\n\
        \        ('<Grid x:Name=\"GridPianoRoll\" ColumnDefinitions=\"60, *\"',\n         '<Grid x:Name=\"GridPianoRoll\"\
        \ ColumnDefinitions=\"30, *\"','piano key column'),\n        ('<Grid ColumnDefinitions=\"60,*\" Padding=\"\
        0\" >',\n         '<Grid ColumnDefinitions=\"30,*\" Padding=\"0\" >','divider key column'),\n        ('<Grid\
        \ x:Name=\"BorderExtend\" ColumnDefinitions=\"60,*\"',\n         '<Grid x:Name=\"BorderExtend\" ColumnDefinitions=\"\
        30,*\"','expression key column'),\n        ('<Grid ColumnDefinitions=\"60,8,*,Auto,100\" Padding=\"0\" >',\n\
        \         '<Grid ColumnDefinitions=\"30,8,*,Auto,100\" Padding=\"0\" >','expression toolbar key column'),\n\
        \    ]:\n        s=once(s,old,new,desc)\n    return s\nedit('Views/EditPage.xaml', xaml)\n\nicons={\n 'touch5_eye_off.svg':'''<svg\
        \ xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\"><g fill=\"none\"\
        \ stroke=\"#181818\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3\
        \ 3l18 18\"/><path d=\"M10.6 5.2A11.3 11.3 0 0 1 12 5c5.2 0 8.9 4.2 10 7-.5 1.4-1.6 3-3 4.2\"/><path d=\"\
        M6.7 6.7C4.1 8.2 2.5 10.5 2 12c1.1 2.8 4.8 7 10 7 1.2 0 2.3-.2 3.3-.5\"/><path d=\"M10 10a3 3 0 0 0 4 4\"\
        /></g></svg>''',\n 'touch5_eye_on.svg':'''<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"\
        \ width=\"24\" height=\"24\"><g fill=\"none\" stroke=\"#181818\" stroke-width=\"2\" stroke-linecap=\"round\"\
        \ stroke-linejoin=\"round\"><path d=\"M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z\"/><circle cx=\"\
        12\" cy=\"12\" r=\"3\"/></g></svg>'''\n}\nfor name,body in icons.items():\n    icon=ROOT/'Resources'/'Images'/name\n\
        \    icon.parent.mkdir(parents=True,exist_ok=True)\n    icon.write_text(body,encoding='utf-8')\n\n# The\
        \ fourth note toolbar control is now a real visibility toggle, not\n# an editing mode; its icon indicates\
