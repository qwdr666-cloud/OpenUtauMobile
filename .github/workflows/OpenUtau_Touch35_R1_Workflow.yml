        change(provider,\n       'ColumnTitle, \"OpenUtau Touch 10\"',\n       'ColumnTitle, \"OpenUtau Touch 11\"\
        ',\n       'Touch 11 provider label')\n\nxaml = root/'Views/EditPage.xaml'\nchange(xaml,\n       'Text=\"\
        Touch 10 diagnosing…\" TextColor=\"White\"',\n       'Text=\"Touch 11 frame pacing…\" TextColor=\"White\"\
        ',\n       'Touch 11 visible diagnostic heading')\n\nedit = root/'Views/EditPage.xaml.cs'\n\n# Guard against\
