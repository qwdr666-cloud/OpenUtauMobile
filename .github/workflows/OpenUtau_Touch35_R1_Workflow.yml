        \       {\n                if (pianoAnimating)\n                {\n                    _pianoMomentum?.Pulse();\n\
        \                    _touch11Dirty = true;\n                }\n                if (trackAnimating)\n   \
        \                 _trackMomentum?.Pulse();\n                if (_touch11Dirty)\n                {\n    \
        \                _touch11Dirty = false;\n                    _touch11LastDrivenFrameNs = frameTimeNanos;\n\
        \                    System.Threading.Interlocked.Increment(ref _touch10DrivenRequests);\n             \
        \       // One cohesive refresh batch. Idle fingers no longer cause\n                    // continual redraws\
