        \    private long _touch11LastVsyncNs;\n    private int _touch11MissedVsyncGaps;''',\n       'Touch 11 adaptive\
        \ frame cadence and stutter diagnostics')\n\n# Touch10 only uses pressed/moved to start the native frame\
