      run: "set -euo pipefail\npython - <<'PYTOUCH8'\nfrom pathlib import Path\nroot = Path('OpenUtauMobile')\n\n\
        def replace_once(path, before, after, purpose):\n    original = path.read_text(encoding='utf-8-sig')\n \
        \   count = original.count(before)\n    if count != 1:\n        raise RuntimeError(f'{purpose}: expected\
        \ one exact source match, found {count}. Target: {path}')\n    path.write_text(original.replace(before,\
        \ after, 1), encoding='utf-8')\n    print('OK:', purpose)\n\n# Each Touch release uses an independent Android\
        \ identity, including DocumentsProvider.\nreplace_once(root/'OpenUtauMobile.csproj',\n    '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v7</ApplicationId>',\n\
        \    '<ApplicationId>pers.vocoder712.openutaumobile.touchmarquee.v8</ApplicationId>',\n    'Touch 8 independent\
        \ Android app ID')\nreplace_once(root/'OpenUtauMobile.csproj',\n    '<ApplicationTitle>OpenUtau Touch 7</ApplicationTitle>',\n\
        \    '<ApplicationTitle>OpenUtau Touch 8</ApplicationTitle>',\n    'Touch 8 app title')\nreplace_once(root/'Platforms/Android/AndroidManifest.xml',\n\
        \    'android:label=\"OpenUtau Touch 7\"',\n    'android:label=\"OpenUtau Touch 8\"',\n    'Touch 8 Android\
        \ launcher label')\nreplace_once(root/'Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs',\n\
        \    'pers.vocoder712.openutaumobile.touchmarquee.v7.documents',\n    'pers.vocoder712.openutaumobile.touchmarquee.v8.documents',\n\
        \    'Touch 8 unique file provider')\nreplace_once(root/'Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs',\n\
        \    'ColumnTitle, \"OpenUtau Touch 7\"',\n    'ColumnTitle, \"OpenUtau Touch 8\"',\n    'Touch 8 file provider\
        \ title')\n\n# The original playback time-position timer is only 20Hz; aim at 120Hz.\n# This changes visual\
        \ play-position polling, not audio sample rate or synthesis.\nreplace_once(Path('OpenUtau.Core/Util/Preferences.cs'),\n\
        \    'public int PlaybackRefreshRate = 20;',\n    'public int PlaybackRefreshRate = 120;',\n    '120Hz target\
        \ for playback cursor updates')\n\nedit = root/'Views/EditPage.xaml.cs'\n# Rx Throttle is a DEBOUNCE, NOT\
        \ a frame limiter: continued gestures can\n# postpone emissions indefinitely. Sample periodically emits\
        \ the latest state.\nreplace_once(edit,\n    '.Throttle(TimeSpan.FromMilliseconds(16.6)) // 限制更新频率为60FPS',\n\
        \    '.Sample(TimeSpan.FromSeconds(1.0 / 120.0)) // Touch 8: sample latest drag position at up to 120Hz;\
        \ do not debounce',\n    'replace delayed horizontal redraws with 120Hz sampling')\n\n# Touch 3's inertia\
        \ animation was created with a 16ms UI timer. Update it to\n# the same nominal 120Hz cadence; the actual\
        \ Android frame rate may be lower.\nreplace_once(edit,\n    '_timer.Interval = TimeSpan.FromMilliseconds(16);',\n\
        \    '_timer.Interval = TimeSpan.FromSeconds(1.0 / 120.0);',\n    '120Hz target for inertial viewport animation')\n\
        \n# Fail before paying for a full Android build if any expected change is missing.\npreferences=Path('OpenUtau.Core/Util/Preferences.cs').read_text(encoding='utf-8-sig')\n\
        code=edit.read_text(encoding='utf-8-sig')\nassert 'public int PlaybackRefreshRate = 120;' in preferences\n\
        assert '.Sample(TimeSpan.FromSeconds(1.0 / 120.0))' in code\nassert '.Throttle(TimeSpan.FromMilliseconds(16.6))'\
        \ not in code\nassert '_timer.Interval = TimeSpan.FromSeconds(1.0 / 120.0);' in code\nassert 'pers.vocoder712.openutaumobile.touchmarquee.v8.documents'\
        \ in (root/'Platforms/Android/Utils/Providers/DataRootDocumentsProvider.cs').read_text(encoding='utf-8-sig')\n\
        print('Touch 8 performance patch applied. Nominal playback / scroll target: 120Hz; physical FPS must be\
        \ measured on a device.')\nPYTOUCH8\n"
