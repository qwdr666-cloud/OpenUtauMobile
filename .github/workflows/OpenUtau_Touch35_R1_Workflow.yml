        \ && !_viewModel.Playing && !animating && !recentlyTouched)\n        {\n            _touch10LoopRunning\
        \ = false;\n            _touch11LastVsyncNs = 0;\n            return;\n        }\n        _touch10Choreographer?.PostFrameCallback(_touch10Callback);\n\
        \    }''',\n       'Coalesce paint requests and pace 60/120Hz inertia from VSYNC')\n\n# The user can compare\
        \ the previous OFF behavior, a lower-load 60Hz mode and\n# experimental 120Hz without rebuilding or modifying\
        \ any project file.\nchange(edit,\n       '''    private void Touch10DriveButton_Clicked(object sender,\
        \ EventArgs e)\n    {\n        _touch10DriveEnabled = !_touch10DriveEnabled;\n        _pianoMomentum?.Stop();\n\
        \        _trackMomentum?.Stop();\n        if (_pianoMomentum != null) _pianoMomentum.ExternalFrameDrive\
        \ = _touch10DriveEnabled;\n        if (_trackMomentum != null) _trackMomentum.ExternalFrameDrive = _touch10DriveEnabled;\n\
        \        Touch10DriveButton.Text = _touch10DriveEnabled ? \"帧驱动：开\" : \"帧驱动：关\";\n#if ANDROID\n        _touch10LastTouchStamp\
        \ = System.Diagnostics.Stopwatch.GetTimestamp();\n        Touch10StartFrameLoop();\n#endif\n    }''',\n\
