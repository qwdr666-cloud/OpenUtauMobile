        \            }\n        }\n        long now = System.Diagnostics.Stopwatch.GetTimestamp();\n        bool\
        \ recentlyTouched = (now - _touch10LastTouchStamp) < System.Diagnostics.Stopwatch.Frequency * 3 / 2;\n \
        \       if (!_touch10FingerDown && !_viewModel.Playing && !animating && !recentlyTouched)\n        {\n \
