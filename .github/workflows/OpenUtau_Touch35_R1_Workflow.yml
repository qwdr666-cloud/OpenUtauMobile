        \        _touch10Choreographer?.PostFrameCallback(_touch10Callback);\n    }''',\n       '''    private void\
        \ Touch10OnFrame(long frameTimeNanos)\n    {\n        if (!_touch10LoopRunning || _touch10Disposed) return;\n\
        \        System.Threading.Interlocked.Increment(ref _touch10VsyncCallbacks);\n\n        // Detect unusually\
