    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Use preinstalled Android SDK
      shell: bash
      run: 'set -euo pipefail

        SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

        test -d "$SDK_ROOT" || { echo "::error::Android SDK directory not found: $SDK_ROOT"; exit 1; }

        echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

        echo "Using Android SDK at $SDK_ROOT"

        ls "$SDK_ROOT/build-tools" || true

        '
    - name: Install MAUI Android workload
      run: dotnet workload install maui-android
    - name: Build signed standalone ARM64 APK
      run: dotnet publish OpenUtauMobile/OpenUtauMobile.csproj -f net9.0-android -c Release -p:TargetFrameworks=net9.0-android
        -p:RuntimeIdentifier=android-arm64 -p:RuntimeIdentifiers=android-arm64 -p:AndroidCreatePackagePerAbi=false -p:AndroidPackageFormats=apk
        -p:AndroidKeyStore=false -p:RunAOTCompilation=true -p:AndroidEnableProfiledAot=true -p:EmbedAssembliesIntoApk=true
        -bl:touch-build.binlog
    - name: Verify package and signature
      shell: bash
      run: "set -euo pipefail\nAPK=$(find OpenUtauMobile/bin/Release -name '*-Signed.apk' -print -quit)\nif [[ -z \"$APK\"\
        \ ]]; then\n  echo '::error::Signed APK not found in Release output'\n  exit 1\nfi\nBUILD_TOOLS=$(find \"$ANDROID_HOME/build-tools\"\
        \ -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)\n\"$BUILD_TOOLS/apksigner\" verify --verbose --print-certs\
        \ \"$APK\" | tee signature.txt\n\"$BUILD_TOOLS/aapt\" dump badging \"$APK\" | tee package.txt\n\"$BUILD_TOOLS/aapt\"\
        \ dump xmltree \"$APK\" AndroidManifest.xml > manifest-tree.txt\n\n# Verify Touch 20 independently of Touch 16 and\
        \ the official package. The previous Touch 1 authority check\n# was mistakenly left in the old workflow and caused\
        \ exit code 1.\ngrep -Fq \"package: name='pers.vocoder712.openutaumobile.touchmarquee.v24'\" package.txt || {\n  echo\
        \ '::error::Touch 24 package name mismatch'; exit 1;\n}\ngrep -Fq \"application-label:'OpenUtau Touch 24'\" package.txt\
        \ || {\n  echo '::error::Touch 24 application label mismatch'; exit 1;\n}\ngrep -Eq \"native-code:.*'arm64-v8a'\"\
        \ package.txt || {\n  echo '::error::Expected ARM64 native libraries not found'; exit 1;\n}\ngrep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v24.documents'\
        \ manifest-tree.txt || {\n  echo '::error::Touch 24 DocumentsProvider authority not found'; exit 1;\n}\nif grep -Fq\
        \ 'pers.vocoder712.openutaumobile.documents' manifest-tree.txt || \\\n   grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.documents'\
        \ manifest-tree.txt || \\\n   grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v2.documents' manifest-tree.txt\
        \ || \\\n   grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v3.documents' manifest-tree.txt || \\\n   grep -Fq\
        \ 'pers.vocoder712.openutaumobile.touchmarquee.v4.documents' manifest-tree.txt || \\\n   grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v5.documents'\
        \ manifest-tree.txt || \\\n   grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v6.documents' manifest-tree.txt\
        \ || \\\n   grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v7.documents' manifest-tree.txt || \\\n   grep -Fq\
        \ 'pers.vocoder712.openutaumobile.touchmarquee.v8.documents' manifest-tree.txt || \\\n    grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v9.documents'\
        \ manifest-tree.txt || \\\n    grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v10.documents' manifest-tree.txt\
        \ || \\\n    grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v11.documents' manifest-tree.txt || \\\n    grep\
        \ -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v12.documents' manifest-tree.txt || \\\n    grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v13.documents'\
        \ manifest-tree.txt || \\\n    grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v14.documents' manifest-tree.txt\
        \ || \\\n    grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v15.documents' manifest-tree.txt || \\\n    grep\
        \ -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v16.documents' manifest-tree.txt || \\\n              grep -Fq\
        \ 'pers.vocoder712.openutaumobile.touchmarquee.v17.documents' manifest-tree.txt || \\\n              grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v18.documents'\
        \ manifest-tree.txt || \\\n                      grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v19.documents'\
        \ manifest-tree.txt || \\\n                      grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v20.documents'\
        \ manifest-tree.txt || \\\n                      grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v21.documents'\
        \ manifest-tree.txt || \\\n                      grep -Fq 'pers.vocoder712.openutaumobile.touchmarquee.v22.documents'\
        \ manifest-tree.txt; then\n  echo '::error::An original or older Touch DocumentsProvider authority remains'\n  exit\
        \ 1\nfi\necho 'Checking packaged AOT outputs (informational):'\nunzip -Z1 \"$APK\" | grep -E 'libaot|aot-data' | head\
        \ -n 12 || true\necho 'All APK identity and coexistence checks passed.' \nmkdir -p artifacts\ncp \"$APK\" artifacts/OpenUtau-Touch-24-Frame-Audit-ARM64.apk\n\
        cp signature.txt package.txt manifest-tree.txt artifacts/\nsha256sum artifacts/*.apk > artifacts/SHA256SUMS\n"
    - uses: actions/upload-artifact@v4
      with:
        name: OpenUtau-Touch-24-Frame-Audit-ARM64
        path: artifacts/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: touch-build-diagnostics
        path: touch-build.binlog
'on':
  workflow_dispatch: null
