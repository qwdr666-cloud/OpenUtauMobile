name: OpenUtau Touch ARM64 from patch
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: qwdr666-cloud/OpenUtauMobile
          ref: 17a86f602e054c345841684224903004eff1f536
          persist-credentials: false
      - name: Apply Touch source changes
        run: |
          python - <<'PYTHON'
          import base64, zlib
          from pathlib import Path
          Path('/tmp/touch.patch').write_bytes(zlib.decompress(base64.b64decode('')))
          PYTHON
          git apply --check /tmp/touch.patch
          git apply /tmp/touch.patch
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub hosted Ubuntu runner already includes Android SDK.
      # Avoid setup-android@v3, which tried to interactively accept unused Google TV SDK licenses.
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "::error::Android SDK directory not found: $SDK_ROOT"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using Android SDK at $SDK_ROOT"
          ls "$SDK_ROOT/build-tools" || true
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build signed standalone ARM64 APK
        run: >-
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj
          -f net9.0-android -c Release
          -p:TargetFrameworks=net9.0-android
          -p:RuntimeIdentifier=android-arm64
          -p:RuntimeIdentifiers=android-arm64
          -p:AndroidCreatePackagePerAbi=false
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=false
          -p:RunAOTCompilation=false
          -p:EmbedAssembliesIntoApk=true
          -bl:touch-build.binlog
      - name: Verify package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find OpenUtauMobile/bin/Release -name '*-Signed.apk' -print -quit)
          test -n "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee package.txt
          grep -q "package: name='pers.vocoder712.openutaumobile.touchmarquee'" package.txt
          grep -q "application-label:'OpenUtau Touch'" package.txt
          grep -q "native-code:.*'arm64-v8a'" package.txt
          mkdir -p artifacts
          cp "$APK" artifacts/OpenUtau-Touch-1.1.7-arm64.apk
          cp signature.txt package.txt artifacts/
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-Touch-1.1.7-arm64
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: touch-build-diagnostics
          path: touch-build.binlog
