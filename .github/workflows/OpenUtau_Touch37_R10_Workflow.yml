    - name: Fix Touch37 lyric cache compilation
      shell: bash
      run: |
        python3 - <<'PY_TOUCH37_FIX'
        from pathlib import Path

        source = Path("OpenUtauMobile/Views/DrawableObjects/DrawableNotes.cs")
        original = source.read_bytes()
        broken = (
            b"            if (!owner.HideLyrics)\n"
            b"                foreach (NoteGraphic g in _unindexedLyrics)\n"
            b"                    if (IntersectsLyric(g, left, top, right, bottom)) return true;\n"
        )
        fixed = (
            b"            foreach (NoteGraphic g in _unindexedLyrics)\n"
            b"                if (IntersectsLyric(g, left, top, right, bottom)) return true;\n"
        )
        if original.count(broken) != 1:
            raise SystemExit("Touch37 lyric occupancy block did not match")
        source.write_bytes(original.replace(broken, fixed, 1))
        PY_TOUCH37_FIX
