    - name: Prepare audio conversion tool
      shell: bash
      timeout-minutes: 6
      run: |
        set -euo pipefail
        if ! command -v ffmpeg >/dev/null 2>&1; then
          tool_dir="$RUNNER_TEMP/touch37-ffmpeg"
          mkdir -p "$tool_dir"
          wheel="$tool_dir/ffmpeg.whl"
          url='https://files.pythonhosted.org/packages/a0/2d/43c8522a2038e9d0e7dbdf3a61195ecc31ca576fb1527a528c877e87d973/imageio_ffmpeg-0.6.0-py3-none-manylinux2014_x86_64.whl'
          curl --fail --show-error --silent --location --retry 2 --retry-all-errors --connect-timeout 10 --max-time 75 -o "$wheel" "$url"
          printf '%s  %s\n' 'c7e46fcec401dd990405049d2e2f475e2b397779df2519b544b8aab515195282' "$wheel" | sha256sum --check
          python - "$wheel" "$tool_dir/ffmpeg" <<'PYFFMPEG'
        from pathlib import Path
        import sys, zipfile

        with zipfile.ZipFile(sys.argv[1]) as wheel:
            binaries = [name for name in wheel.namelist()
                        if name.startswith('imageio_ffmpeg/binaries/ffmpeg-linux-x86_64-')]
            if len(binaries) != 1:
                raise SystemExit('Expected exactly one Linux x86-64 FFmpeg executable')
            executable = Path(sys.argv[2])
            executable.write_bytes(wheel.read(binaries[0]))
            executable.chmod(0o755)
        PYFFMPEG
          export PATH="$tool_dir:$PATH"
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
        fi
        ffmpeg -version
