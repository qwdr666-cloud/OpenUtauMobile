    - name: Load pinned host Worldline for bundled voice rendering
      uses: actions/checkout@v4
      with:
        repository: openutau/OpenUtau
        ref: 9b44e92145b1e35b49765db432246d256dccc30a
        path: .touch35-worldline
        sparse-checkout: 'runtimes/linux-x64/native/libworldline.so

          LICENSE.txt'
        sparse-checkout-cone-mode: false
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Bake all 132 default singer WAVs and test actual C# native renderer
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch37-build/step_61.sh"
    - name: Test singer preparation and installation regressions
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch37-build/step_62.sh"
    - name: Test real ZIP installer and DiffSinger ONNX keyboard inference
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        project=.touch35-core-tests/Test.csproj
        frameworks=(-p:TargetFrameworks=net9.0 -p:TargetFramework=net9.0)
        for attempt in 1 2 3; do
          if timeout --kill-after=5s 120s dotnet restore "$project" "${frameworks[@]}" --disable-parallel; then
            break
          fi
          if [[ "$attempt" == 3 ]]; then
            echo '::error::Core test NuGet restore failed after three attempts'
            exit 1
          fi
          echo "::warning::Core test NuGet restore attempt $attempt failed; retrying"
          sleep "$((attempt * 5))"
        done
        dotnet build "$project" --configuration Release "${frameworks[@]}" --no-restore
        dotnet .touch35-core-tests/bin/Release/net9.0/Test.dll
    - name: Test R7 native instrument parameter banks
      shell: bash
      run: |
        set -euo pipefail
        dotnet build .touch37r7-native-check/Test.csproj -c Release -p:TargetFrameworks=net9.0 -p:TargetFramework=net9.0
        LD_LIBRARY_PATH="$PWD/.touch35-worldline/runtimes/linux-x64/native${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" dotnet .touch37r7-native-check/bin/Release/net9.0/Test.dll
    - name: Compile Touch36 panel against MAUI controls (host API check)
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch37-build/step_76.sh"
    - name: Test R2 lyric controls API and touch state transitions on host
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch37-build/step_79.sh"
    - name: Test shared Android audio device lifecycle with platform doubles
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch37-build/step_64.sh"
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Use preinstalled Android SDK
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch37-build/step_66.sh"
    - name: Install MAUI Android workload
      run: bash -e "$GITHUB_WORKSPACE/.touch37-build/step_67.sh"
    - name: Build signed standalone ARM64 APK
      run: bash -e "$GITHUB_WORKSPACE/.touch37-build/step_68.sh"
    - name: Verify package and signature
      shell: bash
      run: |
        set -euo pipefail
        script="$GITHUB_WORKSPACE/.touch37-build/step_69.sh"
        sed -e 's/touchmarquee[.]v37/touchmarquee.v37.r10/g' -e 's/OpenUtau Touch37/OpenUtau Touch37 R10/g' -e 's/OpenUtau-Touch-35-R6-ARM64/OpenUtau-Touch-37-R10-ARM64/g' "$script" > "${script%.sh}-r10.sh"
        bash -e "${script%.sh}-r10.sh"
        if grep -Eq 'pers[.]vocoder712[.]openutaumobile[.]touchmarquee[.]v37([.]r[3456789])?[.]documents' manifest-tree.txt; then
          echo '::error::The previous Touch37 provider authority remains'
          exit 1
        fi
    - name: Verify 132 rendered singer WAVs inside APK
      shell: bash
      run: bash -e "$GITHUB_WORKSPACE/.touch37-build/step_70.sh"
    - name: Include Touch37 R10 release notes
      shell: bash
      run: |
        mkdir -p artifacts
        cat > artifacts/Touch37-R10-README.txt <<'NOTES'
        OpenUtau Touch37 R10：手动音高帮助
        独立包名 pers.vocoder712.openutaumobile.touchmarquee.v37.r10，可与旧版共存。
        手动修正原音高末尾增加问号，点击查看完整 0–131 音高数值表。
        包含升降号、半音与八度换算、小数音高及手动优先说明。
        保留 R9 音频选择和管理删除及前序功能。
        NOTES
    - uses: actions/upload-artifact@v4
      with:
        name: OpenUTAU-Touch-37-R10-ARM64
        path: artifacts/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: OpenUTAU-Touch-37-R10-BuildLogs
        path: touch-build.binlog
'on':
  workflow_dispatch: null
